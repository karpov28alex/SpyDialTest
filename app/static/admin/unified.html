<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><title>Phantom Control Center</title><style>:root{--bg:#07050c;--line:#392650;--text:#fff;--muted:#aa9dbb;--accent:#a33cff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 Inter,system-ui,sans-serif}.shell{display:grid;grid-template-columns:230px 1fr;min-height:100dvh}.side{padding:18px 12px;border-right:1px solid var(--line);background:#0b0811;position:sticky;top:0;height:100dvh}.brand{font-size:20px;font-weight:900;margin:4px 8px 20px}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.15em}.nav{display:grid;gap:7px}.nav button{border:0;border-radius:12px;padding:12px;text-align:left;background:transparent;color:var(--muted);cursor:pointer}.nav button.active{background:linear-gradient(90deg,rgba(163,60,255,.28),rgba(163,60,255,.08));color:white}.main{min-width:0}.frame{border:0;width:100%;height:100dvh;display:none;background:var(--bg)}.frame.active{display:block}@media(max-width:850px){.shell{display:block}.side{height:auto;position:sticky;z-index:20;border-right:0;border-bottom:1px solid var(--line);padding:10px}.brand{margin:0 8px 8px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.frame{height:calc(100dvh - 92px)}}</style></head><body><div class="shell"><aside class="side"><div class="brand">PHANTOM<small>CONTROL CENTER</small></div><nav class="nav"><button class="active" data-frame="panel">Панель</button><button data-frame="support">Поддержка</button><button data-frame="user360">User 360</button></nav></aside><main class="main"><iframe id="panel" class="frame active" src="/admin/index.html?v=0.8.4"></iframe><iframe id="support" class="frame" src="/admin/support.html?v=0.8.4"></iframe><iframe id="user360" class="frame" src="/admin/user360.html?v=0.8.4"></iframe></main></div><script>document.querySelectorAll('[data-frame]').forEach(button=>button.onclick=()=>{document.querySelectorAll('[data-frame],.frame').forEach(node=>node.classList.remove('active'));button.classList.add('active');document.getElementById(button.dataset.frame).classList.add('active')});</script></body></html>
