<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><title>Phantom Control Center</title><style>
:root{--bg:#07050c;--line:#392650;--text:#fff;--muted:#aa9dbb;--accent:#a33cff}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:14px/1.4 Inter,system-ui,sans-serif;overflow:hidden}.shell{display:grid;grid-template-columns:242px minmax(0,1fr);height:100dvh}.side{padding:18px 12px;border-right:1px solid var(--line);background:linear-gradient(180deg,#0d0914,#09070e);height:100dvh;overflow:auto}.brand{font-size:20px;font-weight:900;margin:4px 8px 20px}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.15em}.nav{display:grid;gap:7px}.nav button{border:1px solid transparent;border-radius:12px;padding:12px;text-align:left;background:transparent;color:var(--muted);cursor:pointer;font:inherit;transition:.18s}.nav button:hover{color:white;background:rgba(163,60,255,.08)}.nav button.active{border-color:rgba(163,60,255,.24);background:linear-gradient(90deg,rgba(163,60,255,.28),rgba(163,60,255,.08));color:white}.group{margin:15px 10px 6px;color:#756b82;font-size:9px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.main{min-width:0;height:100dvh;overflow:hidden;position:relative}.frame{position:absolute;inset:0;border:0;width:100%;height:100%;display:none;background:var(--bg)}.frame.active{display:block}.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);background:var(--bg);z-index:3}.loading.hidden{display:none}@media(max-width:850px){.shell{display:flex;flex-direction:column}.side{height:auto;border-right:0;border-bottom:1px solid var(--line);padding:12px;overflow:visible;z-index:20}.brand{margin:0 8px 9px;font-size:18px}.group{display:none}.nav{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}.nav button{white-space:nowrap;padding:10px 14px;flex:0 0 auto}.main{height:auto;flex:1;min-height:0}}
</style></head><body><div class="shell"><aside class="side"><div class="brand">PHANTOM<small>PLATFORM 2.1</small></div><nav class="nav"><div class="group">Обзор</div><button class="active" data-frame="platform" data-src="/admin/platform.html?v=2.1.0">⚡ Dashboard</button><div class="group">Клиенты и деньги</div><button data-frame="user360" data-src="/admin/user360-v2.html?v=2.1.0">👤 User360 v2</button><button data-frame="billing" data-src="/admin/billing-v2.html?v=2.1.0">💳 Billing v2</button><button data-frame="support" data-src="/admin/support.html?v=2.1.0">💬 Поддержка</button><div class="group">Продукт</div><button data-frame="funnel" data-src="/admin/funnel.html?v=2.1.0">🔐 Доступ и воронка</button><button data-frame="panel" data-src="/admin/index.html?v=2.1.0">⚙️ Панель и настройки</button></nav></aside><main class="main"><div id="loading" class="loading">Загрузка Phantom Platform…</div><iframe id="platform" class="frame active" title="Dashboard"></iframe><iframe id="user360" class="frame" title="User360 v2"></iframe><iframe id="billing" class="frame" title="Billing v2"></iframe><iframe id="support" class="frame" title="Поддержка"></iframe><iframe id="funnel" class="frame" title="Воронка"></iframe><iframe id="panel" class="frame" title="Настройки"></iframe></main></div><script>
const loading=document.getElementById('loading');const frames={platform:document.getElementById('platform'),user360:document.getElementById('user360'),billing:document.getElementById('billing'),support:document.getElementById('support'),funnel:document.getElementById('funnel'),panel:document.getElementById('panel')};const loaded=new Set();function getAdminToken(){try{const own=sessionStorage.getItem('adminToken')||localStorage.getItem('adminToken');if(own)return own;for(const f of Object.values(frames)){const value=f.contentWindow?.sessionStorage?.getItem('adminToken')||f.contentWindow?.localStorage?.getItem('adminToken');if(value)return value}}catch(_){}return null}function bridgeToken(frame){const t=getAdminToken();if(!t)return;try{frame.contentWindow.sessionStorage.setItem('adminToken',t);frame.contentWindow.localStorage.setItem('adminToken',t);sessionStorage.setItem('adminToken',t);localStorage.setItem('adminToken',t)}catch(_){}}function loadFrame(name){const f=frames[name];if(loaded.has(name))return;loading.classList.remove('hidden');bridgeToken(f);f.src=document.querySelector(`[data-frame="${name}"]`).dataset.src;loaded.add(name)}Object.entries(frames).forEach(([name,f])=>f.addEventListener('load',()=>{bridgeToken(f);loading.classList.add('hidden')}));document.querySelectorAll('[data-frame]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-frame],.frame').forEach(x=>x.classList.remove('active'));b.classList.add('active');frames[b.dataset.frame].classList.add('active');loadFrame(b.dataset.frame)});loadFrame('platform');
</script></body></html>
