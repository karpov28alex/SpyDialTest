<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Phantom Control Center</title>
<style>
:root{--bg:#07050c;--line:#392650;--text:#fff;--muted:#aa9dbb;--accent:#a33cff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:14px/1.4 Inter,system-ui,sans-serif;overflow:hidden}.shell{display:grid;grid-template-columns:238px minmax(0,1fr);height:100dvh;min-height:100dvh}.side{padding:18px 12px;border-right:1px solid var(--line);background:linear-gradient(180deg,#0d0914,#09070e);height:100dvh;overflow:auto}.brand{font-size:20px;font-weight:900;margin:4px 8px 20px}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.15em}.nav{display:grid;gap:7px}.nav button{border:1px solid transparent;border-radius:12px;padding:12px;text-align:left;background:transparent;color:var(--muted);cursor:pointer;font:inherit;transition:.18s}.nav button:hover{color:white;background:rgba(163,60,255,.08)}.nav button.active{border-color:rgba(163,60,255,.24);background:linear-gradient(90deg,rgba(163,60,255,.28),rgba(163,60,255,.08));color:white}.group{margin:15px 10px 6px;color:#756b82;font-size:9px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.main{min-width:0;height:100dvh;overflow:hidden;position:relative}.frame{position:absolute;inset:0;border:0;width:100%;height:100%;display:none;background:var(--bg)}.frame.active{display:block}.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);background:var(--bg);z-index:3}.loading.hidden{display:none}@media(max-width:850px){html,body{overflow:hidden}.shell{display:flex;flex-direction:column;height:100dvh}.side{height:auto;flex:0 0 auto;border-right:0;border-bottom:1px solid var(--line);padding:12px 12px 10px;overflow:visible;position:relative;z-index:20}.brand{margin:0 8px 9px;font-size:18px}.brand small{font-size:9px}.group{display:none}.nav{display:flex;gap:5px;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;padding-bottom:1px}.nav::-webkit-scrollbar{display:none}.nav button{white-space:nowrap;padding:10px 14px;flex:0 0 auto}.main{height:auto;flex:1;min-height:0}}
</style>
</head>
<body>
<div class="shell"><aside class="side"><div class="brand">PHANTOM<small>PLATFORM 2.0</small></div><nav class="nav">
<div class="group">Обзор</div>
<button class="active" data-frame="platform" data-src="/admin/platform.html?v=2.0.0">⚡ Dashboard</button>
<button data-frame="panel" data-src="/admin/index.html?v=2.0.0">Панель управления</button>
<div class="group">Клиенты и деньги</div>
<button data-frame="user360" data-src="/admin/user360.html?v=2.0.0">👤 User 360</button>
<button data-frame="impaya" data-src="/admin/impaya.html?v=2.0.0">💳 Billing · Impaya</button>
<button data-frame="support" data-src="/admin/support.html?v=2.0.0">💬 Поддержка</button>
<div class="group">Продукт</div>
<button data-frame="funnel" data-src="/admin/funnel.html?v=2.0.0">🔐 Доступ и воронка</button>
</nav></aside><main class="main"><div id="loading" class="loading">Загрузка Phantom Platform…</div>
<iframe id="platform" class="frame active" title="Platform Dashboard"></iframe><iframe id="panel" class="frame" title="Панель"></iframe><iframe id="impaya" class="frame" title="Impaya"></iframe><iframe id="support" class="frame" title="Поддержка"></iframe><iframe id="user360" class="frame" title="User 360"></iframe><iframe id="funnel" class="frame" title="Доступ и воронка"></iframe>
</main></div>
<script>
const loading=document.getElementById('loading');const frames={platform:document.getElementById('platform'),panel:document.getElementById('panel'),impaya:document.getElementById('impaya'),support:document.getElementById('support'),user360:document.getElementById('user360'),funnel:document.getElementById('funnel')};const loaded=new Set();
function getAdminToken(){try{const own=sessionStorage.getItem('adminToken')||localStorage.getItem('adminToken');if(own)return own;return frames.panel.contentWindow?.sessionStorage?.getItem('adminToken')||frames.panel.contentWindow?.localStorage?.getItem('adminToken')}catch(_){return null}}
function bridgeToken(frame){const token=getAdminToken();if(!token)return;try{frame.contentWindow.sessionStorage.setItem('adminToken',token);frame.contentWindow.localStorage.setItem('adminToken',token);sessionStorage.setItem('adminToken',token);localStorage.setItem('adminToken',token)}catch(_){}}
function normalizeChild(name,frame){try{const doc=frame.contentDocument;if(!doc)return;if(name==='panel'){const style=doc.createElement('style');style.dataset.unifiedAdmin='1';style.textContent=`html,body{min-height:100%!important}body{overflow-x:hidden!important}.shell{display:block!important;min-height:100%!important}.side{display:block!important;height:auto!important;position:sticky!important;top:0!important;z-index:30!important;border-right:0!important;border-bottom:1px solid var(--line)!important;padding:8px 10px!important;background:rgba(7,5,12,.97)!important;backdrop-filter:blur(18px)!important}.side .brand{display:none!important}.side .nav{display:flex!important;gap:6px!important;overflow-x:auto!important;scrollbar-width:none!important;padding:0 0 2px!important}.side .nav::-webkit-scrollbar{display:none!important}.side .nav button{display:block!important;white-space:nowrap!important;flex:0 0 auto!important;padding:10px 13px!important;text-align:center!important}.main{max-width:none!important;width:100%!important;padding:16px!important}@media(max-width:850px){.main{padding:12px!important}.top{align-items:flex-start!important}.top h1{font-size:28px!important}}`;if(!doc.querySelector('style[data-unified-admin]'))doc.head.appendChild(style)}else if(name==='support'||name==='funnel'){const back=doc.querySelector('a[href="/admin"]');if(back)back.style.display='none'}}catch(_){}}
function watchNavigation(name,frame){try{const path=frame.contentWindow.location.pathname;if(path==='/admin'&&name!=='platform'){loaded.delete(name);bridgeToken(frame);frame.contentWindow.location.replace(document.querySelector(`[data-frame="${name}"]`).dataset.src)}}catch(_){}}
function loadFrame(name){const frame=frames[name];if(loaded.has(name))return;loading.classList.remove('hidden');bridgeToken(frame);frame.src=document.querySelector(`[data-frame="${name}"]`).dataset.src;loaded.add(name)}
Object.entries(frames).forEach(([name,frame])=>{frame.addEventListener('load',()=>{bridgeToken(frame);normalizeChild(name,frame);watchNavigation(name,frame);loading.classList.add('hidden')})});document.querySelectorAll('[data-frame]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('[data-frame],.frame').forEach(node=>node.classList.remove('active'));button.classList.add('active');const name=button.dataset.frame;frames[name].classList.add('active');loadFrame(name)}));loadFrame('platform');
</script></body></html>
