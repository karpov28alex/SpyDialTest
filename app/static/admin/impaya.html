<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Impaya · Phantom</title>
<style>
:root{--bg:#07050c;--panel:#100b18;--line:#38234f;--text:#fff;--muted:#aa9dbb;--accent:#a33cff;--ok:#49d897;--bad:#ff6d89;--warn:#ffc857}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#241039 0,transparent 36%),var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif}.wrap{padding:22px;max-width:1700px;margin:auto}.top{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;margin-bottom:18px}.top h1{margin:0;font-size:30px}.top p{margin:5px 0 0;color:var(--muted)}button,input,select{font:inherit}.btn{border:1px solid var(--line);background:#171020;color:#fff;border-radius:11px;padding:10px 14px;cursor:pointer}.btn.primary{background:linear-gradient(135deg,#7b20dc,#ad47ff);border:0}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{background:linear-gradient(145deg,rgba(25,15,36,.95),rgba(11,8,17,.95));border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 16px 55px rgba(0,0,0,.22)}.metric small{color:var(--muted);display:block}.metric b{font-size:28px;display:block;margin-top:5px}.metric em{font-style:normal;color:#caa5ee}.section{margin-top:16px}.section h2{font-size:18px;margin:0}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.filters{display:flex;flex-wrap:wrap;gap:8px}.filters input,.filters select{background:#0c0812;border:1px solid var(--line);color:#fff;border-radius:10px;padding:9px 11px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:15px}table{width:100%;border-collapse:collapse;min-width:950px;background:rgba(9,6,13,.75)}th,td{padding:11px 12px;text-align:left;border-bottom:1px solid rgba(57,38,80,.7);vertical-align:top}th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;position:sticky;top:0;background:#100b18}tr:hover td{background:rgba(163,60,255,.05)}.pill{display:inline-flex;border-radius:99px;padding:4px 8px;font-size:11px;font-weight:700}.paid,.active{background:rgba(73,216,151,.14);color:var(--ok)}.failed,.off{background:rgba(255,109,137,.14);color:var(--bad)}.pending{background:rgba(255,200,87,.14);color:var(--warn)}.mono{font-family:ui-monospace,SFMono-Regular,monospace;font-size:12px}.muted{color:var(--muted)}.error{color:var(--bad);max-width:360px}.switch{border:0;border-radius:99px;padding:7px 11px;cursor:pointer;font-weight:700}.switch.on{background:rgba(73,216,151,.17);color:var(--ok)}.switch.off{background:rgba(255,109,137,.15);color:var(--bad)}.tabs{display:flex;gap:8px;margin:16px 0}.tab{border:1px solid var(--line);background:transparent;color:var(--muted);padding:9px 13px;border-radius:11px;cursor:pointer}.tab.active{background:rgba(163,60,255,.2);color:#fff}.pane{display:none}.pane.active{display:block}.notice{display:none;margin:10px 0;padding:10px 12px;border-radius:10px;background:#21132e;color:#dcbcff}@media(max-width:950px){.grid{grid-template-columns:repeat(2,1fr)}.wrap{padding:14px}.top{display:block}.top .btn{margin-top:12px}}@media(max-width:520px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body><main class="wrap">
<div class="top"><div><h1>💳 Impaya Finance Center</h1><p>Платежи, рекуррентные подписки, карты и ошибки в одном месте.</p></div><button class="btn primary" onclick="loadAll()">Обновить данные</button></div>
<div id="notice" class="notice"></div>
<section id="metrics" class="grid"></section>
<div class="tabs"><button class="tab active" data-pane="payments">Операции</button><button class="tab" data-pane="subscriptions">Подписки</button></div>
<section id="payments" class="pane active card section"><div class="head"><h2>Платёжные операции</h2><div class="filters"><input id="q" placeholder="Telegram ID, username, операция"><select id="status"><option value="all">Все статусы</option><option value="paid">Успешные</option><option value="failed">Ошибки</option><option value="pending">Ожидают</option></select><select id="kind"><option value="all">Все типы</option><option value="initial">Первый платёж</option><option value="renewal">Продление</option><option value="fallback">Резервное</option></select><button class="btn" onclick="loadPayments()">Найти</button></div></div><div class="table-wrap"><table><thead><tr><th>ID / дата</th><th>Пользователь</th><th>Тип</th><th>Сумма</th><th>Статус</th><th>Impaya</th><th>Ошибка</th></tr></thead><tbody id="paymentsBody"></tbody></table></div></section>
<section id="subscriptions" class="pane card section"><div class="head"><h2>Рекуррентные подписки</h2><span id="subCount" class="muted"></span></div><div class="table-wrap"><table><thead><tr><th>Пользователь</th><th>VIP</th><th>Следующее списание</th><th>Карта</th><th>Привязка</th><th>Автопродление</th></tr></thead><tbody id="subscriptionsBody"></tbody></table></div></section>
</main>
<script>
const token=()=>sessionStorage.getItem('adminToken')||localStorage.getItem('adminToken')||'';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dt=v=>v?new Date(v).toLocaleString('ru-RU'):'—';
const rub=v=>new Intl.NumberFormat('ru-RU',{style:'currency',currency:'RUB',maximumFractionDigits:0}).format(Number(v||0));
async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{'Authorization':'Bearer '+token(),'Content-Type':'application/json',...(opt.headers||{})}});if(r.status===401){show('Сессия администратора истекла. Откройте главную панель и войдите снова.');throw new Error('Unauthorized')}const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.detail||'Ошибка запроса');return data}
function show(t){const n=document.getElementById('notice');n.textContent=t;n.style.display='block';setTimeout(()=>n.style.display='none',5000)}
async function loadOverview(){const d=await api('/api/admin/impaya/overview');const m=[['Выручка всего',rub(d.revenue.all_time),'Сегодня '+rub(d.revenue.today)],['За 30 дней',rub(d.revenue.last_30d),'Успешность '+d.payments.success_rate+'%'],['Платежи',d.payments.paid+' / '+d.payments.total,'Ошибок '+d.payments.failed+' · pending '+d.payments.pending],['Автопродления',d.subscriptions.auto_renew_enabled,'Карт '+d.subscriptions.cards_bound+' · ожидают '+d.subscriptions.upcoming_charges],['Первый платёж',rub(d.tariffs.initial_rub),'VIP 1 день'],['Продление',rub(d.tariffs.renewal_rub),'VIP 7 дней'],['Резервный тариф',rub(d.tariffs.fallback_rub),'VIP 3 дня']];document.getElementById('metrics').innerHTML=m.map(x=>`<article class="card metric"><small>${esc(x[0])}</small><b>${esc(x[1])}</b><em>${esc(x[2])}</em></article>`).join('')}
function statusPill(v){return `<span class="pill ${esc(v)}">${esc(v)}</span>`}
async function loadPayments(){const p=new URLSearchParams({status:document.getElementById('status').value,kind:document.getElementById('kind').value,q:document.getElementById('q').value,limit:'200'});const d=await api('/api/admin/impaya/payments?'+p);document.getElementById('paymentsBody').innerHTML=d.items.map(x=>`<tr><td><b>#${x.id}</b><br><span class="muted">${dt(x.created_at)}</span><br><span class="mono">${esc(x.external_id)}</span></td><td><b>${esc(x.name||'Без имени')}</b><br>${x.username?'@'+esc(x.username):''}<br><span class="mono">${esc(x.telegram_id)}</span></td><td>${esc(x.kind)}<br><span class="muted">${x.recurring?'recurrent':'one-time'}</span></td><td><b>${rub(x.amount)}</b></td><td>${statusPill(x.status)}<br><span class="muted">${esc(x.state||'')}</span></td><td><span class="mono">${esc(x.transaction_id||'—')}</span><br><span class="muted">${esc(x.terminal_name||'')}</span></td><td class="error">${esc(x.error||'—')}</td></tr>`).join('')||'<tr><td colspan="7" class="muted">Операций не найдено</td></tr>'}
async function loadSubscriptions(){const d=await api('/api/admin/impaya/subscriptions');document.getElementById('subCount').textContent='Всего: '+d.count;document.getElementById('subscriptionsBody').innerHTML=d.items.map(x=>`<tr><td><b>${esc(x.name||'Без имени')}</b><br>${x.username?'@'+esc(x.username):''}<br><span class="mono">${esc(x.telegram_id)}</span></td><td>${x.active?'<span class="pill active">активен</span>':'<span class="pill off">неактивен</span>'}<br><span class="muted">до ${dt(x.vip_ends_at)}</span></td><td>${dt(x.next_charge_at)}</td><td><b>${esc(x.pan_mask||'нет данных')}</b><br><span class="muted">${esc(x.bank_name||'')} ${esc(x.card_type||'')}</span></td><td><span class="mono">${esc(x.binding_id||'—')}</span><br><span class="muted">payment #${x.source_payment_id}</span></td><td><button class="switch ${x.auto_renew?'on':'off'}" onclick="toggleRenew(${x.user_id},${!x.auto_renew})">${x.auto_renew?'Включено':'Отключено'}</button></td></tr>`).join('')||'<tr><td colspan="6" class="muted">Привязок пока нет</td></tr>'}
async function toggleRenew(userId,enabled){if(!confirm((enabled?'Включить':'Отключить')+' автопродление?'))return;await api(`/api/admin/impaya/subscriptions/${userId}/auto-renew`,{method:'PATCH',body:JSON.stringify({enabled})});show('Настройка автопродления сохранена');await Promise.all([loadOverview(),loadSubscriptions()])}
async function loadAll(){try{await Promise.all([loadOverview(),loadPayments(),loadSubscriptions()])}catch(e){show(e.message)}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.pane').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.pane).classList.add('active')});
loadAll();
</script></body></html>
