<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><title>Phantom User 360</title><style>:root{--bg:#07050c;--panel:#160f23;--line:#3d2858;--text:#fff;--muted:#aa9dbb;--accent:#a23cff;--green:#50dda2;--red:#ff668f}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#2a1146 0,transparent 34%),var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif}.wrap{max-width:1500px;margin:auto;padding:20px}.card{background:linear-gradient(145deg,rgba(29,18,45,.97),rgba(11,8,17,.97));border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px}.toolbar,.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}input,select,button{font:inherit}input,select{padding:12px;border:1px solid var(--line);border-radius:12px;background:#0a0710;color:white}input{flex:1;min-width:220px}button{padding:12px 15px;border:0;border-radius:12px;color:white;cursor:pointer;background:#1b1328;border:1px solid var(--line)}button.primary{background:linear-gradient(135deg,var(--accent),#6929dc);font-weight:800}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.metric span,.muted{color:var(--muted)}.metric strong{display:block;font-size:26px;margin-top:7px}.split{display:grid;grid-template-columns:1.1fr .9fr;gap:14px}.results{display:grid;gap:8px;margin-top:12px}.result{text-align:left;width:100%}.badge{display:inline-block;padding:4px 9px;border-radius:999px;background:rgba(162,60,255,.18)}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.timeline{display:grid;gap:10px}.event{padding:12px;border-left:3px solid var(--accent);background:rgba(162,60,255,.07);border-radius:0 12px 12px 0}.switch{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.switch input{flex:0;min-width:auto}.hidden{display:none!important}.notice{padding:12px;border-radius:12px;background:rgba(80,221,162,.1);color:var(--green);margin-top:10px}.error{color:var(--red)}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.split{grid-template-columns:1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.wrap{padding:12px}}</style></head><body><div class="wrap"><div class="card"><h1>User 360</h1><p class="muted">Полная карточка пользователя Phantom Spy</p><div class="toolbar"><input id="q" placeholder="Telegram ID, username или имя"><button id="search" class="primary">Найти</button></div><div id="results" class="results"></div></div><div id="root" class="hidden"></div></div><script>const token=sessionStorage.getItem('adminToken');const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=v=>v?new Date(v).toLocaleString('ru-RU'):'—';const money=v=>`${Number(v||0).toLocaleString('ru-RU',{maximumFractionDigits:2})} ₽`;async function api(path,opt={}){const r=await fetch(path,{...opt,headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`,...(opt.headers||{})},cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'Ошибка API');return d}function metric(n,v){return `<div class="card metric"><span>${esc(n)}</span><strong>${esc(v)}</strong></div>`}async function search(){try{const d=await api('/api/admin/user360/search?q='+encodeURIComponent($('#q').value));$('#results').innerHTML=d.items.map(u=>`<button class="result" onclick="openUser(${u.id})"><b>${esc(u.name||u.username||'Пользователь')}</b><div class="muted">@${esc(u.username||'—')} · ${u.telegram_id} · ${esc(u.subscription_status)}</div></button>`).join('')||'<div class="muted">Ничего не найдено</div>'}catch(e){$('#results').innerHTML=`<div class="error">${esc(e.message)}</div>`}}$('#search').onclick=search;$('#q').onkeydown=e=>{if(e.key==='Enter')search()};async function openUser(id){const d=await api(`/api/admin/user360/users/${id}`),u=d.user,m=d.metrics,s=d.settings;$('#root').classList.remove('hidden');$('#root').innerHTML=`<div class="card"><div class="actions"><div style="flex:1"><h2>${esc(u.name||u.username||'Пользователь')}</h2><div class="muted">@${esc(u.username||'—')} · ${u.telegram_id}</div></div><span class="badge">${esc(u.subscription_status)}</span><a href="https://t.me/${esc(u.username||'')}" target="_blank"><button>Открыть Telegram</button></a></div><p>Регистрация: ${fmt(u.registered_at)} · Последняя активность: ${fmt(u.last_seen_at)}</p><p>Trial до: ${fmt(u.trial_ends_at)} · VIP до: ${fmt(u.vip_ends_at)}</p></div><div class="grid">${metric('Диалоги',m.dialogs)}${metric('Сообщения',m.messages)}${metric('Изменено',m.edited)}${metric('Удалено',m.deleted)}${metric('Медиа',m.media)}${metric('Скрытые медиа',m.protected_media)}${metric('Оплачено',money(m.paid_total))}${metric('Средний чек',money(m.average_check))}${metric('Платежи',m.payments)}${metric('Рефералы',m.referrals)}${metric('Business',m.active_business+'/'+m.business_connections)}${metric('Доступ',u.access_disabled?'Отключён':'Активен')}</div><div class="split"><div><div class="card"><h3>Настройки пользователя</h3>${Object.entries(s).filter(([k])=>typeof s[k]==='boolean').map(([k,v])=>`<label class="switch"><span>${esc(k)}</span><input data-setting="${k}" type="checkbox" ${v?'checked':''}></label>`).join('')}<div class="actions" style="margin-top:12px"><button class="primary" onclick="saveSettings(${id})">Сохранить настройки</button></div><div id="settingsMsg"></div></div><div class="card"><h3>Выдать доступ</h3><div class="actions"><select id="grantKind"><option value="vip">VIP</option><option value="trial">Trial</option></select><input id="grantDays" type="number" value="3" min="1" max="3650"><button class="primary" onclick="grant(${id})">Выдать</button></div><div id="grantMsg"></div></div><div class="card"><h3>Business-подключения</h3>${d.connections.length?`<table><tr><th>ID</th><th>Статус</th><th>Подключено</th><th>Активность</th></tr>${d.connections.map(x=>`<tr><td>${esc(x.telegram_connection_id)}</td><td>${x.active?'Активно':'Отключено'}</td><td>${fmt(x.connected_at)}</td><td>${fmt(x.last_activity_at)}</td></tr>`).join('')}</table>`:'<div class="muted">Нет подключений</div>'}</div><div class="card"><h3>Платежи</h3>${d.payments.length?`<table><tr><th>Дата</th><th>Сумма</th><th>Статус</th><th>Провайдер</th></tr>${d.payments.slice(0,30).map(x=>`<tr><td>${fmt(x.paid_at||x.created_at)}</td><td>${money(x.amount)}</td><td>${esc(x.status)}</td><td>${esc(x.provider)}</td></tr>`).join('')}</table>`:'<div class="muted">Платежей нет</div>'}</div></div><div><div class="card"><h3>Таймлайн</h3><div class="timeline">${d.timeline.map(x=>`<div class="event"><b>${esc(x.title)}</b><div class="muted">${fmt(x.at)}</div></div>`).join('')||'<div class="muted">Событий нет</div>'}</div></div><div class="card"><h3>Приглашённые пользователи</h3>${d.referrals.length?d.referrals.map(x=>`<div style="padding:10px 0;border-bottom:1px solid var(--line)"><b>${esc(x.user.name||x.user.username||x.user.telegram_id)}</b><div class="muted">@${esc(x.user.username||'—')} · ${fmt(x.joined_at)}</div></div>`).join(''):'<div class="muted">Никого не пригласил</div>'}</div></div></div>`;window.scrollTo({top:$('#root').offsetTop-10,behavior:'smooth'})}async function saveSettings(id){try{const body={};document.querySelectorAll('[data-setting]').forEach(x=>body[x.dataset.setting]=x.checked);await api(`/api/admin/user360/users/${id}/settings`,{method:'PATCH',body:JSON.stringify(body)});$('#settingsMsg').innerHTML='<div class="notice">Настройки сохранены</div>'}catch(e){$('#settingsMsg').innerHTML=`<div class="error">${esc(e.message)}</div>`}}async function grant(id){try{await api(`/api/admin/user360/users/${id}/grant`,{method:'POST',body:JSON.stringify({kind:$('#grantKind').value,days:Number($('#grantDays').value)})});$('#grantMsg').innerHTML='<div class="notice">Доступ выдан</div>';await openUser(id)}catch(e){$('#grantMsg').innerHTML=`<div class="error">${esc(e.message)}</div>`}}search();</script></body></html>
