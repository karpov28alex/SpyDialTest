<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>User360 v2 · Phantom</title><style>
:root{--bg:#08060d;--panel:#120e1b;--line:#332542;--text:#faf7ff;--muted:#ab9fba;--accent:#a84cff;--green:#44d69b;--red:#ff6a7f}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,rgba(168,76,255,.12),transparent 32%),var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif}.wrap{max-width:1520px;margin:auto;padding:24px}.top{display:flex;gap:12px;align-items:center;margin-bottom:18px}.search{flex:1;display:flex;gap:8px}.input,.btn{border:1px solid var(--line);border-radius:12px;background:#0d0a13;color:white;padding:11px 13px;font:inherit}.input{width:100%;outline:none}.input:focus{border-color:#75439d}.btn{cursor:pointer}.btn.primary{background:linear-gradient(135deg,#7d26d5,#b64eff);border:0}.btn.danger{color:#ff9cad;border-color:rgba(255,106,127,.35);background:rgba(255,106,127,.08)}.layout{display:grid;grid-template-columns:300px minmax(0,1fr) 320px;gap:14px}.card{background:linear-gradient(145deg,rgba(19,14,28,.98),rgba(13,10,19,.98));border:1px solid var(--line);border-radius:18px;padding:16px}.results{max-height:calc(100vh - 115px);overflow:auto}.userrow{padding:12px;border:1px solid transparent;border-radius:13px;cursor:pointer;margin-bottom:7px}.userrow:hover,.userrow.active{background:rgba(168,76,255,.1);border-color:rgba(168,76,255,.26)}.userrow b{display:block}.muted{color:var(--muted)}.profile{display:flex;align-items:center;gap:14px;margin-bottom:16px}.avatar{width:58px;height:58px;border-radius:18px;background:linear-gradient(145deg,#4f1b79,#a84cff);display:grid;place-items:center;font-size:22px;font-weight:900}.profile h1{font-size:26px;margin:0 0 3px}.badges{display:flex;gap:7px;flex-wrap:wrap}.badge{display:inline-flex;padding:5px 8px;border-radius:999px;background:#27202f;font-size:11px;font-weight:800}.badge.ok{background:rgba(68,214,155,.12);color:#82efbd}.badge.bad{background:rgba(255,106,127,.12);color:#ff9cac}.metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:9px}.metric{background:#0d0a13;border:1px solid var(--line);border-radius:13px;padding:11px}.metric small{color:var(--muted);display:block}.metric b{font-size:18px}.sections{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.section{border:1px solid var(--line);border-radius:14px;padding:13px;background:#0d0a13}.section h3{margin:0 0 10px;font-size:15px}.timeline{max-height:330px;overflow:auto}.event{padding:9px 0;border-bottom:1px solid rgba(51,37,66,.65)}.event:last-child{border:0}.payment{display:grid;grid-template-columns:1fr auto;gap:8px;padding:9px 0;border-bottom:1px solid rgba(51,37,66,.65)}.actions{position:sticky;top:18px;max-height:calc(100vh - 36px);overflow:auto}.field{margin:11px 0}.field label{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}.stack{display:grid;gap:8px}.empty{padding:35px;text-align:center;color:var(--muted)}@media(max-width:1200px){.layout{grid-template-columns:260px 1fr}.actions{grid-column:1/-1;position:static;max-height:none}.metrics{grid-template-columns:repeat(3,1fr)}}@media(max-width:760px){.wrap{padding:13px}.top{display:block}.search{margin-top:8px}.layout{grid-template-columns:1fr}.results{max-height:260px}.metrics{grid-template-columns:repeat(2,1fr)}.sections{grid-template-columns:1fr}.profile h1{font-size:22px}}
</style></head><body><main class="wrap"><div class="top"><div><div style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#c78dff;font-weight:900">Phantom Platform 2.0</div><b style="font-size:25px">User360 v2</b></div><div class="search"><input class="input" id="q" placeholder="Telegram ID, username или имя"><button class="btn primary" id="find">Найти</button></div></div><div class="layout"><aside class="card results" id="results"><div class="empty">Введите пользователя</div></aside><section class="card" id="workspace"><div class="empty">Выберите пользователя для просмотра полной карточки</div></section><aside class="card actions"><h3 style="margin-top:0">Быстрые действия</h3><div id="actionTarget" class="muted">Пользователь не выбран</div><div class="field"><label>Выдать VIP, дней</label><input class="input" type="number" id="grantDays" value="7"></div><button class="btn primary" id="grant" style="width:100%">Выдать / продлить VIP</button><div class="field"><label>Управление доступом</label><div class="stack"><button class="btn danger" id="disable">Заблокировать доступ</button><button class="btn" id="enable">Разблокировать доступ</button></div></div><div class="field"><label>Уведомления</label><div class="stack"><button class="btn" id="notifyOn">Включить все уведомления</button><button class="btn" id="notifyOff">Отключить все уведомления</button></div></div><div id="msg"></div></aside></div></main><script>
const token=()=>sessionStorage.getItem('adminToken')||localStorage.getItem('adminToken');const headers=()=>({'Authorization':'Bearer '+token(),'Content-Type':'application/json'});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const dt=v=>v?new Date(v).toLocaleString('ru-RU'):'—';const money=v=>new Intl.NumberFormat('ru-RU',{style:'currency',currency:'RUB',maximumFractionDigits:0}).format(v||0);async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{...headers(),...(opt.headers||{})}});if(r.status===401){location.href='/admin';throw Error('Требуется вход')}const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||d.error?.message||'Ошибка запроса');return d}let selected=null;
async function search(){results.innerHTML='<div class="empty">Загрузка…</div>';const d=await api('/api/admin/user360/search?q='+encodeURIComponent(q.value));results.innerHTML=d.items.length?d.items.map(u=>`<div class="userrow" data-id="${u.id}"><b>${esc([u.first_name,u.last_name].filter(Boolean).join(' ')||u.username||u.telegram_id)}</b><span class="muted">${esc(u.username?'@'+u.username:u.telegram_id)} · ${esc(u.subscription_status)}</span></div>`).join(''):'<div class="empty">Никого не найдено</div>';results.querySelectorAll('[data-id]').forEach(e=>e.onclick=()=>loadUser(e.dataset.id,e))}
async function loadUser(id,node){results.querySelectorAll('.userrow').forEach(e=>e.classList.remove('active'));node?.classList.add('active');workspace.innerHTML='<div class="empty">Загрузка карточки…</div>';const d=await api('/api/admin/user360/users/'+id);selected=d.user;actionTarget.textContent=(d.user.username?'@'+d.user.username:d.user.telegram_id)+' · ID '+d.user.id;const m=d.metrics,u=d.user;workspace.innerHTML=`<div class="profile"><div class="avatar">${esc((u.first_name||u.username||'P').slice(0,1).toUpperCase())}</div><div><h1>${esc([u.first_name,u.last_name].filter(Boolean).join(' ')||u.username||u.telegram_id)}</h1><div class="muted">${esc(u.username?'@'+u.username:'без username')} · Telegram ${esc(u.telegram_id)}</div><div class="badges" style="margin-top:7px"><span class="badge ${u.access_disabled?'bad':'ok'}">${u.access_disabled?'Доступ заблокирован':'Доступ разрешён'}</span><span class="badge">${esc(u.subscription_status)}</span><span class="badge ${m.active_business?'ok':'bad'}">Business: ${m.active_business?'активен':'нет'}</span></div></div></div><div class="metrics"><div class="metric"><small>Диалоги</small><b>${m.dialogs}</b></div><div class="metric"><small>Сообщения</small><b>${m.messages}</b></div><div class="metric"><small>Удалено</small><b>${m.deleted}</b></div><div class="metric"><small>Изменено</small><b>${m.edited}</b></div><div class="metric"><small>Оплаты</small><b>${m.payments}</b></div><div class="metric"><small>Доход</small><b>${money(m.paid_total)}</b></div></div><div class="sections"><div class="section"><h3>Доступ и активность</h3><div class="payment"><span>Регистрация</span><b>${dt(u.registered_at)}</b></div><div class="payment"><span>Последняя активность</span><b>${dt(u.last_seen_at)}</b></div><div class="payment"><span>Trial до</span><b>${dt(u.trial_ends_at)}</b></div><div class="payment"><span>VIP до</span><b>${dt(u.vip_ends_at)}</b></div><div class="payment"><span>Язык / часовой пояс</span><b>${esc(u.language_code||'—')} / ${esc(u.timezone||'UTC')}</b></div></div><div class="section"><h3>Настройки</h3>${Object.entries(d.settings).map(([k,v])=>`<div class="payment"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('')}</div><div class="section"><h3>Последние платежи</h3>${d.payments.slice(0,12).map(p=>`<div class="payment"><span><b>${money(p.amount)}</b><br><small class="muted">${esc(p.provider)} · ${esc(p.external_id)}</small></span><span class="badge ${p.status==='paid'?'ok':'bad'}">${esc(p.status)}</span></div>`).join('')||'<div class="muted">Платежей нет</div>'}</div><div class="section"><h3>Хронология</h3><div class="timeline">${d.timeline.map(e=>`<div class="event"><b>${esc(e.title)}</b><br><small class="muted">${dt(e.at)}</small></div>`).join('')||'<div class="muted">Событий нет</div>'}</div></div><div class="section"><h3>Telegram Business</h3>${d.connections.map(c=>`<div class="payment"><span><b>${c.active?'Активно':'Отключено'}</b><br><small class="muted mono">${esc(c.telegram_connection_id)}</small></span><span>${dt(c.connected_at)}</span></div>`).join('')||'<div class="muted">Подключений нет</div>'}</div><div class="section"><h3>Рефералы</h3>${d.referrals.map(r=>`<div class="payment"><span>${esc(r.user.username?'@'+r.user.username:r.user.telegram_id)}</span><span>${dt(r.joined_at)}</span></div>`).join('')||'<div class="muted">Приглашений нет</div>'}</div></div>`}
find.onclick=search;q.onkeydown=e=>{if(e.key==='Enter')search()};async function act(fn){if(!selected)return alert('Сначала выберите пользователя');try{await fn();msg.innerHTML='<div class="badge ok" style="margin-top:12px">Готово</div>';const node=results.querySelector(`[data-id="${selected.id}"]`);loadUser(selected.id,node)}catch(e){msg.innerHTML='<div class="badge bad" style="margin-top:12px">'+esc(e.message)+'</div>'}}grant.onclick=()=>act(()=>api('/api/admin/user360/users/'+selected.id+'/grant',{method:'POST',body:JSON.stringify({days:+grantDays.value,kind:'vip'})}));disable.onclick=()=>act(()=>api('/api/admin/growth/users/'+selected.id+'/access',{method:'PATCH',body:JSON.stringify({disabled:true,reason:'User360 v2'})}));enable.onclick=()=>act(()=>api('/api/admin/growth/users/'+selected.id+'/access',{method:'PATCH',body:JSON.stringify({disabled:false,reason:'User360 v2'})}));const settingsBody=v=>({notifications_enabled:v,notify_edits:v,notify_deletions:v,notify_protected_media:v,notify_connection:v});notifyOn.onclick=()=>act(()=>api('/api/admin/user360/users/'+selected.id+'/settings',{method:'PATCH',body:JSON.stringify(settingsBody(true))}));notifyOff.onclick=()=>act(()=>api('/api/admin/user360/users/'+selected.id+'/settings',{method:'PATCH',body:JSON.stringify(settingsBody(false))}));
</script></body></html>
