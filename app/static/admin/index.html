<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Dialog Spy Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
    :root{--bg:#08070e;--panel:#11101a;--panel2:#171424;--line:#2d2740;--text:#f6f2ff;--muted:#9890aa;--accent:#9b5cff;--accent2:#5f2eea;--green:#42e8a5;--red:#ff5d82;--shadow:0 18px 60px rgba(70,30,130,.25)}
    *{box-sizing:border-box}body{margin:0;font:14px/1.45 Inter,ui-sans-serif,system-ui;background:radial-gradient(circle at 75% 0,#251345 0,transparent 35%),var(--bg);color:var(--text)}button,input{font:inherit}.hidden{display:none!important}
    .login{min-height:100vh;display:grid;place-items:center;padding:24px}.login-card{width:min(420px,100%);padding:30px;background:rgba(17,16,26,.94);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}.logo{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),#43229c);box-shadow:0 0 38px rgba(155,92,255,.45);font-weight:900;font-size:20px}.login h1{margin:18px 0 4px}.sub{color:var(--muted);margin:0 0 24px}.field{display:grid;gap:7px;margin:14px 0}.field input,.search{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:#0c0b12;color:var(--text);outline:none}.field input:focus,.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(155,92,255,.13)}.primary{border:0;border-radius:12px;padding:13px 18px;color:white;background:linear-gradient(135deg,var(--accent),var(--accent2));cursor:pointer;font-weight:700}.error{color:var(--red);min-height:22px}
    .shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.sidebar{position:sticky;top:0;height:100vh;padding:22px 16px;border-right:1px solid var(--line);background:rgba(9,8,14,.92);backdrop-filter:blur(18px)}.brand{display:flex;align-items:center;gap:12px;padding:0 8px 22px}.brand strong{font-size:17px}.nav{display:grid;gap:7px}.nav button{border:0;text-align:left;color:var(--muted);background:transparent;padding:12px 14px;border-radius:12px;cursor:pointer}.nav button.active,.nav button:hover{color:white;background:linear-gradient(90deg,rgba(155,92,255,.2),rgba(155,92,255,.04));box-shadow:inset 3px 0 var(--accent)}.version{position:absolute;bottom:20px;left:24px;color:#635d70;font-size:12px}.main{padding:26px;min-width:0}.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:22px}.topbar h1{margin:0;font-size:25px}.ghost{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:10px 14px;border-radius:11px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:linear-gradient(155deg,rgba(24,20,36,.97),rgba(14,13,21,.97));border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}.metric span{color:var(--muted);font-size:12px}.metric strong{display:block;font-size:27px;margin-top:8px}.metric i{font-style:normal;color:var(--green);font-size:11px}.charts{display:grid;grid-template-columns:1.2fr 1fr;gap:14px;margin-top:14px}.chart-wrap{height:310px}.section{display:none}.section.active{display:block}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.table-card{overflow:auto;padding:0}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{text-align:left;padding:13px 15px;border-bottom:1px solid rgba(45,39,64,.75)}.table th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}.table tr:hover td{background:rgba(155,92,255,.04)}.badge{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:11px;background:rgba(155,92,255,.14);color:#c9a8ff}.badge.red{background:rgba(255,93,130,.12);color:#ff8ca8}.badge.green{background:rgba(66,232,165,.12);color:#7ef0bd}.click{cursor:pointer;color:#cbaeff}.detail{margin-top:14px}.messages{display:grid;gap:10px}.message{padding:14px;border:1px solid var(--line);border-radius:14px;background:#0d0c13}.message.outgoing{margin-left:14%;border-color:#49366d}.message.incoming{margin-right:14%}.meta{display:flex;gap:10px;color:var(--muted);font-size:11px;margin-bottom:7px}.deleted{color:var(--red)}.versions{margin-top:10px;padding:10px;border-left:2px solid var(--accent);background:rgba(155,92,255,.05);font-size:12px}.empty{padding:40px;text-align:center;color:var(--muted)}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}.charts{grid-template-columns:1fr}}@media(max-width:720px){.shell{grid-template-columns:1fr}.sidebar{height:auto;position:static;border-right:0;border-bottom:1px solid var(--line)}.nav{grid-template-columns:repeat(4,1fr)}.nav button{text-align:center;padding:10px 5px;font-size:12px}.version{display:none}.main{padding:16px}.grid{grid-template-columns:1fr 1fr}.charts{grid-template-columns:1fr}.topbar{align-items:flex-start}.metric strong{font-size:22px}}
  </style>
</head>
<body>
<div id="login" class="login">
  <form id="loginForm" class="login-card">
    <div class="logo">DS</div><h1>Dialog Spy Admin</h1><p class="sub">Защищённая панель управления сервисом</p>
    <label class="field">Email<input id="email" type="email" autocomplete="username" required></label>
    <label class="field">Пароль<input id="password" type="password" autocomplete="current-password" required></label>
    <div id="loginError" class="error"></div><button class="primary" type="submit">Войти</button>
  </form>
</div>
<div id="app" class="shell hidden">
  <aside class="sidebar"><div class="brand"><div class="logo">DS</div><div><strong>Dialog Spy</strong><div class="sub" style="margin:1px 0">Control Center</div></div></div>
    <nav class="nav"><button class="active" data-page="dashboard">◈ Дашборд</button><button data-page="users">◎ Пользователи</button><button data-page="media">◆ Protected</button><button data-page="system">⌁ Система</button></nav><div class="version">v0.5.0</div>
  </aside>
  <main class="main"><header class="topbar"><div><h1 id="title">Дашборд</h1><div class="sub" style="margin:3px 0">Мониторинг в реальном времени</div></div><button id="logout" class="ghost">Выйти</button></header>
    <section id="dashboard" class="section active"><div id="metrics" class="grid"></div><div class="charts"><div class="card chart-wrap"><canvas id="registrationChart"></canvas></div><div class="card chart-wrap"><canvas id="eventsChart"></canvas></div></div><div class="card" style="margin-top:14px"><h3>Последние пользователи</h3><div id="recentUsers"></div></div></section>
    <section id="users" class="section"><div class="section-head"><input id="userSearch" class="search" placeholder="Telegram ID, username или имя"><button id="searchBtn" class="primary">Найти</button></div><div class="card table-card"><div id="usersTable"></div></div><div id="userDetail" class="detail"></div></section>
    <section id="media" class="section"><div class="card table-card"><div id="mediaTable"></div></div></section>
    <section id="system" class="section"><div class="grid"><div class="card metric"><span>API</span><strong id="apiState">—</strong></div><div class="card metric"><span>Версия</span><strong>0.5.0</strong></div><div class="card metric"><span>Хранилище</span><strong>Private</strong></div><div class="card metric"><span>Webhook</span><strong>HTTPS</strong></div></div></section>
  </main>
</div>
<script>
const state={token:sessionStorage.getItem('adminToken'),charts:[]};
const qs=s=>document.querySelector(s); const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opts={}){const r=await fetch(path,{...opts,headers:{'Content-Type':'application/json',Authorization:`Bearer ${state.token}`,...opts.headers}});if(r.status===401){logout();throw new Error('Сессия завершена')}if(!r.ok)throw new Error((await r.json().catch(()=>({detail:'Ошибка'}))).detail||'Ошибка API');return r.json()}
function logout(){sessionStorage.removeItem('adminToken');state.token=null;qs('#app').classList.add('hidden');qs('#login').classList.remove('hidden')}
qs('#loginForm').addEventListener('submit',async e=>{e.preventDefault();qs('#loginError').textContent='';try{const r=await fetch('/api/admin/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:qs('#email').value,password:qs('#password').value})});if(!r.ok)throw new Error('Неверный email или пароль');const d=await r.json();state.token=d.access_token;sessionStorage.setItem('adminToken',state.token);boot()}catch(err){qs('#loginError').textContent=err.message}});qs('#logout').onclick=logout;
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button,.section').forEach(x=>x.classList.remove('active'));b.classList.add('active');qs('#'+b.dataset.page).classList.add('active');qs('#title').textContent=b.textContent.trim().replace(/^[^ ]+ /,'');if(b.dataset.page==='users')loadUsers();if(b.dataset.page==='media')loadMedia();if(b.dataset.page==='system')checkSystem()});
function metric(label,value,extra=''){return `<div class="card metric"><span>${esc(label)}</span><strong>${esc(value)}</strong><i>${esc(extra)}</i></div>`}
async function loadDashboard(){const d=await api('/api/admin/dashboard');const m=d.metrics;qs('#metrics').innerHTML=[metric('Пользователи',m.users_total,`+${m.users_today} сегодня`),metric('Business подключения',m.active_business),metric('Активный trial',m.active_trial),metric('VIP',m.active_vip),metric('Сообщения',m.messages),metric('Изменённые',m.edited_messages),metric('Удалённые',m.deleted_messages),metric('Protected media',m.protected_media),metric('Выручка за месяц',`${m.revenue_month.toLocaleString('ru-RU')} ₽`),metric('Выручка всего',`${m.revenue_total.toLocaleString('ru-RU')} ₽`),metric('Диалоги',m.dialogs),metric('Ошибки',m.failed_updates)].join('');qs('#recentUsers').innerHTML=userTable(d.recent_users);state.charts.forEach(c=>c.destroy());state.charts=[new Chart(qs('#registrationChart'),{type:'line',data:{labels:d.registrations.map(x=>x.date),datasets:[{label:'Регистрации',data:d.registrations.map(x=>x.count),borderColor:'#9b5cff',backgroundColor:'rgba(155,92,255,.18)',fill:true,tension:.35}]},options:chartOptions()}),new Chart(qs('#eventsChart'),{type:'bar',data:{labels:d.events.map(x=>x.date),datasets:[{label:'Изменено',data:d.events.map(x=>x.edited),backgroundColor:'#9b5cff'},{label:'Удалено',data:d.events.map(x=>x.deleted),backgroundColor:'#ff5d82'}]},options:chartOptions()})]}
function chartOptions(){return{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#aaa2b7'}}},scales:{x:{ticks:{color:'#777080'},grid:{color:'rgba(255,255,255,.04)'}},y:{beginAtZero:true,ticks:{color:'#777080'},grid:{color:'rgba(255,255,255,.04)'}}}}}
function userTable(items){if(!items.length)return '<div class="empty">Нет данных</div>';return `<table class="table"><thead><tr><th>Пользователь</th><th>Telegram ID</th><th>Статус</th><th>Регистрация</th></tr></thead><tbody>${items.map(u=>`<tr data-user="${u.id}"><td class="click">${esc(u.name||u.username||'Без имени')}<div class="sub" style="margin:0">@${esc(u.username||'—')}</div></td><td>${u.telegram_id}</td><td><span class="badge ${u.blocked?'red':'green'}">${esc(u.subscription_status)}</span></td><td>${new Date(u.registered_at).toLocaleString('ru-RU')}</td></tr>`).join('')}</tbody></table>`}
async function loadUsers(){const d=await api('/api/admin/users?search='+encodeURIComponent(qs('#userSearch').value));qs('#usersTable').innerHTML=userTable(d.items);qs('#usersTable').querySelectorAll('[data-user]').forEach(r=>r.onclick=()=>openUser(r.dataset.user))}
qs('#searchBtn').onclick=loadUsers;qs('#userSearch').addEventListener('keydown',e=>{if(e.key==='Enter')loadUsers()});
async function openUser(id){const [u,ds]=await Promise.all([api(`/api/admin/users/${id}`),api(`/api/admin/users/${id}/dialogs`)]);qs('#userDetail').innerHTML=`<div class="card"><h3>${esc(u.name||u.username||u.telegram_id)}</h3><div class="grid"><div class="metric"><span>Диалоги</span><strong>${u.dialogs_count}</strong></div><div class="metric"><span>Сообщения</span><strong>${u.messages_count}</strong></div><div class="metric"><span>Trial до</span><strong style="font-size:14px">${new Date(u.trial_ends_at).toLocaleString('ru-RU')}</strong></div><div class="metric"><span>Business</span><strong>${u.connections.filter(x=>x.active).length}</strong></div></div><h3>Диалоги</h3>${ds.items.length?ds.items.map(d=>`<div class="message click" data-dialog="${d.id}"><b>${esc(d.name||d.username||d.telegram_chat_id)}</b><div class="sub" style="margin:3px 0">${d.messages_count} сообщений · ${d.last_message_at?new Date(d.last_message_at).toLocaleString('ru-RU'):'—'}</div></div>`).join(''):'<div class="empty">Диалогов нет</div>'}<div id="dialogMessages"></div></div>`;qs('#userDetail').querySelectorAll('[data-dialog]').forEach(x=>x.onclick=()=>openDialog(x.dataset.dialog))}
async function openDialog(id){const d=await api(`/api/admin/dialogs/${id}/messages`);qs('#dialogMessages').innerHTML=`<h3>${esc(d.dialog.name||d.dialog.username||'Диалог')}</h3><div class="messages">${d.items.map(m=>`<div class="message ${m.direction}"><div class="meta"><span>${new Date(m.sent_at).toLocaleString('ru-RU')}</span>${m.edited_at?'<span>изменено</span>':''}${m.is_deleted?'<span class="deleted">удалено</span>':''}</div><div>${esc(m.text||m.caption||'['+(m.media[0]?.type||'медиа')+']')}</div>${m.versions.length?`<div class="versions"><b>История:</b>${m.versions.map(v=>`<div>v${v.number} · ${new Date(v.created_at).toLocaleString('ru-RU')} — ${esc(v.text||v.caption||'медиа')}</div>`).join('')}</div>`:''}</div>`).join('')}</div>`}
async function loadMedia(){const d=await api('/api/admin/protected-media');qs('#mediaTable').innerHTML=d.items.length?`<table class="table"><thead><tr><th>ID</th><th>Тип</th><th>Диалог</th><th>Статус</th><th>Размер</th><th>Дата</th></tr></thead><tbody>${d.items.map(m=>`<tr><td>${m.id}</td><td>${esc(m.type)}</td><td>${esc(m.dialog_name||m.dialog_id)}</td><td><span class="badge">${esc(m.status)}</span></td><td>${m.size?Math.round(m.size/1024)+' КБ':'—'}</td><td>${new Date(m.created_at).toLocaleString('ru-RU')}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">Protected media пока нет</div>'}
async function checkSystem(){try{const r=await fetch('/health/ready');qs('#apiState').textContent=r.ok?'READY':'ERROR';qs('#apiState').style.color=r.ok?'var(--green)':'var(--red)'}catch{qs('#apiState').textContent='OFFLINE'}}
async function boot(){if(!state.token)return logout();qs('#login').classList.add('hidden');qs('#app').classList.remove('hidden');try{await loadDashboard()}catch(e){logout();qs('#loginError').textContent=e.message}}
if(state.token)boot();
</script>
</body></html>
