<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><title>Dialog Spy Admin</title><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script><style>
:root{--bg:#08070e;--panel:#12101b;--panel2:#191426;--line:#302642;--text:#f7f3ff;--muted:#9b91aa;--accent:#a460ff;--accent2:#692fe6;--green:#45dda4;--red:#ff6389;--shadow:0 18px 55px rgba(76,26,145,.24)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 80% 0,#28124b 0,transparent 35%),var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,-apple-system,sans-serif}button,input{font:inherit}.hidden{display:none!important}.login{min-height:100dvh;display:grid;place-items:center;padding:20px}.login-card{width:min(430px,100%);padding:28px;background:rgba(18,16,27,.96);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow)}.logo{width:56px;height:56px;border-radius:17px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));font-weight:900;font-size:20px;box-shadow:0 0 34px rgba(164,96,255,.42)}h1,h2,h3{margin-top:0}.sub,.muted{color:var(--muted)}.field{display:grid;gap:7px;margin:15px 0}.field input,.search{width:100%;padding:14px;border:1px solid var(--line);border-radius:13px;background:#0b0a11;color:var(--text);outline:none}.primary,.ghost{border:0;border-radius:13px;padding:12px 16px;color:white;cursor:pointer}.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));font-weight:700}.ghost{background:var(--panel);border:1px solid var(--line)}.error{color:var(--red);min-height:22px}.shell{display:grid;grid-template-columns:245px minmax(0,1fr);min-height:100dvh}.sidebar{position:sticky;top:0;height:100dvh;padding:22px 16px;border-right:1px solid var(--line);background:rgba(9,8,14,.94);z-index:5}.brand{display:flex;gap:12px;align-items:center;padding:0 8px 22px}.nav{display:grid;gap:7px}.nav button{border:0;text-align:left;color:var(--muted);background:transparent;padding:12px 14px;border-radius:13px;cursor:pointer}.nav button.active{color:white;background:linear-gradient(90deg,rgba(164,96,255,.24),rgba(164,96,255,.04));box-shadow:inset 3px 0 var(--accent)}.version{position:absolute;bottom:18px;left:22px;color:#645c70}.main{padding:26px;min-width:0;max-width:1500px;width:100%}.topbar{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.card{background:linear-gradient(155deg,rgba(25,20,38,.97),rgba(13,12,19,.98));border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:var(--shadow);min-width:0}.metric span{color:var(--muted);font-size:12px}.metric strong{display:block;font-size:27px;margin-top:7px}.metric i{font-style:normal;color:var(--green);font-size:11px}.charts{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:13px}.chart{height:300px}.section{display:none}.section.active{display:block}.section-head{display:flex;gap:10px;margin-bottom:13px}.table-card{overflow:auto;padding:0}.table{width:100%;border-collapse:collapse;min-width:700px}.table th,.table td{text-align:left;padding:13px 14px;border-bottom:1px solid rgba(48,38,66,.72)}.table th{color:var(--muted);font-size:11px;text-transform:uppercase}.click{cursor:pointer;color:#d4b7ff}.badge{display:inline-flex;padding:4px 8px;border-radius:999px;background:rgba(164,96,255,.16);color:#d4b7ff;font-size:11px}.badge.green{color:#74edba;background:rgba(69,221,164,.12)}.badge.red{color:#ff91aa;background:rgba(255,99,137,.12)}.empty{padding:35px;text-align:center;color:var(--muted)}.profile-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:13px}.info-list{display:grid;gap:10px}.info-row{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid rgba(48,38,66,.7)}.timeline{display:grid;gap:8px;max-height:360px;overflow:auto}.timeline-item{padding:10px 12px;border-left:2px solid var(--accent);background:rgba(164,96,255,.06)}.dialog-list{display:grid;gap:9px}.dialog-card{display:flex;align-items:center;gap:12px;padding:13px;border:1px solid var(--line);border-radius:15px;background:#0d0b13;cursor:pointer}.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;background:linear-gradient(135deg,#7f3cff,#321565);overflow:hidden;font-weight:800}.avatar img{width:100%;height:100%;object-fit:cover}.chat{padding:15px;background:radial-gradient(circle at 100% 0,rgba(99,42,170,.16),transparent 35%),#0a0810;border-radius:18px;border:1px solid var(--line)}.messages{display:flex;flex-direction:column;gap:10px}.message{max-width:78%;padding:11px 13px;border-radius:17px;background:#21162f;border:1px solid #3a2751;align-self:flex-start}.message.outgoing{align-self:flex-end;background:linear-gradient(145deg,#6527bd,#3b176d);border-color:#8141d3}.message.deleted{opacity:.7;border-style:dashed}.meta{font-size:10px;color:#b4a9c1;margin-top:6px}.versions{margin-top:9px;padding:9px;border-left:2px solid var(--accent);background:rgba(0,0,0,.2)}.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}.media-card{padding:10px;border:1px solid var(--line);border-radius:14px;background:#0d0b13}.media-card img,.media-card video{width:100%;max-height:230px;object-fit:cover;border-radius:10px}.media-card audio{width:100%}.tabs{display:flex;gap:8px;overflow:auto;margin:15px 0}.tab{white-space:nowrap;border:1px solid var(--line);background:#0d0b13;color:var(--muted);padding:9px 12px;border-radius:999px}.tab.active{background:rgba(164,96,255,.2);color:white;border-color:#6f3cab}@media(max-width:1050px){.grid{grid-template-columns:repeat(2,1fr)}.charts,.profile-grid{grid-template-columns:1fr}}@media(max-width:760px){.shell{display:block}.sidebar{position:sticky;top:0;height:auto;padding:12px;border-right:0;border-bottom:1px solid var(--line);backdrop-filter:blur(18px)}.brand{padding:0 2px 10px}.brand .logo{width:42px;height:42px;border-radius:13px;font-size:15px}.nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}.nav button{flex:0 0 auto;text-align:center;padding:9px 11px;font-size:12px}.version{display:none}.main{padding:14px}.topbar{align-items:flex-start}.topbar h1{font-size:24px}.grid{grid-template-columns:1fr 1fr}.card{padding:14px;border-radius:16px}.metric strong{font-size:23px}.charts{grid-template-columns:1fr}.chart{height:240px}.table{min-width:620px}.profile-grid{grid-template-columns:1fr}.message{max-width:88%}.section-head{flex-direction:column}.section-head .primary{width:100%}.media-grid{grid-template-columns:1fr 1fr}}@media(max-width:390px){.grid,.media-grid{grid-template-columns:1fr}.main{padding:11px}.nav button{font-size:11px;padding:8px 9px}}
</style></head><body><div id="login" class="login"><form id="loginForm" class="login-card"><div class="logo">DS</div><h1 style="margin:18px 0 4px">Dialog Spy Admin</h1><p class="sub">Защищённая панель управления</p><label class="field">Email<input id="email" type="email" required></label><label class="field">Пароль<input id="password" type="password" required></label><div id="loginError" class="error"></div><button class="primary">Войти</button></form></div><div id="app" class="shell hidden"><aside class="sidebar"><div class="brand"><div class="logo">DS</div><div><b>Dialog Spy</b><div class="sub">Центр управления</div></div></div><nav class="nav"><button class="active" data-page="dashboard">Дашборд</button><button data-page="users">Пользователи</button><button data-page="media">Защищённые медиа</button><button data-page="system">Система</button></nav><div class="version">v0.5.1</div></aside><main class="main"><header class="topbar"><div><h1 id="title">Дашборд</h1><div id="subtitle" class="sub">Ключевые показатели сервиса</div></div><button id="logout" class="ghost">Выйти</button></header><section id="dashboard" class="section active"><div id="metrics" class="grid"></div><div class="charts"><div class="card chart"><canvas id="registrationChart"></canvas></div><div class="card chart"><canvas id="eventsChart"></canvas></div></div><div class="card" style="margin-top:13px"><h3>Последние пользователи</h3><div id="recentUsers"></div></div></section><section id="users" class="section"><div class="section-head"><input id="userSearch" class="search" placeholder="Telegram ID, username или имя"><button id="searchBtn" class="primary">Найти пользователя</button></div><div class="card table-card"><div id="usersTable"></div></div><div id="userDetail" style="margin-top:13px"></div></section><section id="media" class="section"><div id="mediaTable" class="media-grid"></div></section><section id="system" class="section"><div class="grid"><div class="card metric"><span>API</span><strong id="apiState">—</strong></div><div class="card metric"><span>Версия приложения</span><strong>0.5.1</strong></div><div class="card metric"><span>Хранилище</span><strong>Приватное</strong></div><div class="card metric"><span>Webhook</span><strong>HTTPS</strong></div></div></section></main></div><script>
const state={token:sessionStorage.getItem('adminToken'),charts:[],user:null};const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const dt=v=>v?new Date(v).toLocaleString('ru-RU'):'—';
async function api(path,opt={}){const r=await fetch(path,{...opt,headers:{'Content-Type':'application/json',Authorization:`Bearer ${state.token}`,...opt.headers}});if(r.status===401){logout();throw Error('Сессия завершена')}if(!r.ok){const d=await r.json().catch(()=>null);throw Error(d?.detail||d?.error?.message||'Ошибка API')}return r.json()}function logout(){sessionStorage.removeItem('adminToken');state.token=null;$('#app').classList.add('hidden');$('#login').classList.remove('hidden')}$('#logout').onclick=logout;$('#loginForm').onsubmit=async e=>{e.preventDefault();$('#loginError').textContent='';try{const r=await fetch('/api/admin/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('#email').value,password:$('#password').value})});if(!r.ok)throw Error('Неверный email или пароль');state.token=(await r.json()).access_token;sessionStorage.setItem('adminToken',state.token);boot()}catch(x){$('#loginError').textContent=x.message}};
const pageMeta={dashboard:['Дашборд','Ключевые показатели сервиса'],users:['Пользователи','Карточки, активность и переписки'],media:['Защищённые медиа','Временные и защищённые вложения'],system:['Система','Состояние инфраструктуры']};document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-page],.section').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#'+b.dataset.page).classList.add('active');[$('#title').textContent,$('#subtitle').textContent]=pageMeta[b.dataset.page];if(b.dataset.page==='users')loadUsers();if(b.dataset.page==='media')loadMedia();if(b.dataset.page==='system')checkSystem()});
function metric(label,value,extra=''){return `<div class="card metric"><span>${esc(label)}</span><strong>${esc(value)}</strong><i>${esc(extra)}</i></div>`}function table(items){if(!items.length)return '<div class="empty">Нет данных</div>';return `<table class="table"><thead><tr><th>Пользователь</th><th>Telegram ID</th><th>Доступ</th><th>Регистрация</th></tr></thead><tbody>${items.map(u=>`<tr data-user="${u.id}"><td class="click">${esc(u.name||u.username||'Без имени')}<div class="sub">@${esc(u.username||'—')}</div></td><td>${u.telegram_id}</td><td><span class="badge ${u.blocked?'red':'green'}">${esc(u.subscription_status)}</span></td><td>${dt(u.registered_at)}</td></tr>`).join('')}</tbody></table>`}
async function loadDashboard(){const d=await api('/api/admin/dashboard'),m=d.metrics;$('#metrics').innerHTML=[metric('Всего пользователей',m.users_total,`+${m.users_today} сегодня`),metric('Активные Business-подключения',m.active_business),metric('Пользователи на trial',m.active_trial),metric('Активные VIP',m.active_vip),metric('Сохранённые сообщения',m.messages),metric('Реально изменённые сообщения',m.edited_messages),metric('Удалённые сообщения',m.deleted_messages),metric('Защищённые медиа',m.protected_media),metric('Выручка за месяц',`${m.revenue_month.toLocaleString('ru-RU')} ₽`),metric('Выручка за всё время',`${m.revenue_total.toLocaleString('ru-RU')} ₽`),metric('Диалоги',m.dialogs),metric('Неразобранные ошибки',m.failed_updates)].join('');$('#recentUsers').innerHTML=table(d.recent_users);bindUsers($('#recentUsers'));state.charts.forEach(c=>c.destroy());state.charts=[new Chart($('#registrationChart'),{type:'line',data:{labels:d.registrations.map(x=>x.date),datasets:[{label:'Регистрации',data:d.registrations.map(x=>x.count),borderColor:'#a460ff',backgroundColor:'rgba(164,96,255,.15)',fill:true,tension:.35}]},options:opts()}),new Chart($('#eventsChart'),{type:'bar',data:{labels:d.events.map(x=>x.date),datasets:[{label:'Изменено',data:d.events.map(x=>x.edited),backgroundColor:'#a460ff'},{label:'Удалено',data:d.events.map(x=>x.deleted),backgroundColor:'#ff6389'}]},options:opts()})]}function opts(){return{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#aaa2b7'}}},scales:{x:{ticks:{color:'#777080'},grid:{color:'rgba(255,255,255,.04)'}},y:{beginAtZero:true,ticks:{color:'#777080'},grid:{color:'rgba(255,255,255,.04)'}}}}}
function bindUsers(root){root.querySelectorAll('[data-user]').forEach(x=>x.onclick=()=>openUser(x.dataset.user))}async function loadUsers(){const d=await api('/api/admin/users?search='+encodeURIComponent($('#userSearch').value));$('#usersTable').innerHTML=table(d.items);bindUsers($('#usersTable'))}$('#searchBtn').onclick=loadUsers;$('#userSearch').onkeydown=e=>{if(e.key==='Enter')loadUsers()};
async function openUser(id){const [u,ds]=await Promise.all([api(`/api/admin/users/${id}`),api(`/api/admin/users/${id}/dialogs`)]);state.user=u;$('#userDetail').innerHTML=`<div class="profile-grid"><div class="card"><h2>${esc(u.name||u.username||u.telegram_id)}</h2><div class="info-list"><div class="info-row"><span>Первый запуск</span><b>${dt(u.registered_at)}</b></div><div class="info-row"><span>Последняя активность</span><b>${dt(u.last_seen_at)}</b></div><div class="info-row"><span>Источник регистрации</span><b>${esc(u.registration_source)}</b></div><div class="info-row"><span>Кто пригласил</span><b>${u.referrer?esc(u.referrer.name||u.referrer.username||u.referrer.telegram_id):'Никто'}</b></div><div class="info-row"><span>Статус доступа</span><b>${esc(u.subscription_status)}</b></div><div class="info-row"><span>Диалоги / сообщения</span><b>${u.dialogs_count} / ${u.messages_count}</b></div></div></div><div class="card"><h3>Действия за последние 24 часа</h3><div class="timeline">${u.activity_24h.length?u.activity_24h.map(a=>`<div class="timeline-item"><b>${esc(a.type)}</b><div class="sub">${dt(a.at)}</div></div>`).join(''):'<div class="empty">Активности нет</div>'}</div></div></div><div class="tabs"><button class="tab active">Все диалоги</button><button class="tab">Скрытые диалоги отмечены отдельно</button></div><div class="dialog-list">${ds.items.length?ds.items.map(d=>`<div class="dialog-card" data-dialog="${d.id}"><span class="avatar">${d.avatar?`<img src="${esc(d.avatar)}">`:esc((d.name||d.username||'?')[0])}</span><div><b>${esc(d.name||d.username||d.telegram_chat_id)}</b><div class="sub">${d.messages_count} сообщений · ${dt(d.last_message_at)} ${d.is_hidden?'· скрыт':''}</div></div></div>`).join(''):'<div class="empty">Диалогов нет</div>'}</div><div id="dialogMessages" style="margin-top:13px"></div>`;$('#userDetail').querySelectorAll('[data-dialog]').forEach(x=>x.onclick=()=>openDialog(x.dataset.dialog))}
function media(m){if(!m.url)return `<div class="muted">${esc(m.type)} · ${esc(m.status)}</div>`;if(['photo','sticker'].includes(m.type))return `<img src="${esc(m.url)}" loading="lazy">`;if(['video','animation','video_note'].includes(m.type))return `<video src="${esc(m.url)}" controls playsinline></video>`;if(['voice','audio'].includes(m.type))return `<audio src="${esc(m.url)}" controls></audio>`;return `<a class="click" href="${esc(m.url)}" target="_blank">Скачать ${esc(m.filename||m.type)}</a>`}async function openDialog(id){const d=await api(`/api/admin/dialogs/${id}/messages`);$('#dialogMessages').innerHTML=`<div class="chat"><h3>${esc(d.dialog.name||d.dialog.username||'Диалог')}</h3><div class="messages">${d.items.map(m=>`<article class="message ${m.direction} ${m.is_deleted?'deleted':''}"><div>${esc(m.text||m.caption||(!m.media.length?'Сообщение':''))}</div>${m.media.map(x=>`<div class="media-card">${media(x)}</div>`).join('')}<div class="meta">${dt(m.sent_at)}${m.edited_at?' · изменено':''}${m.is_deleted?' · удалено':''}</div>${m.edited_at&&m.versions.length?`<div class="versions"><b>История изменений</b>${m.versions.map(v=>`<div>Версия ${v.number} · ${dt(v.created_at)} — ${esc(v.text||v.caption||'[медиа]')}</div>`).join('')}</div>`:''}</article>`).join('')}</div></div>`;$('#dialogMessages').scrollIntoView({behavior:'smooth'})}
async function loadMedia(){const d=await api('/api/admin/protected-media');$('#mediaTable').innerHTML=d.items.length?d.items.map(m=>`<div class="media-card"><b>${esc(m.dialog_name||'Диалог')}</b><div class="sub">${esc(m.type)} · ${dt(m.created_at)}</div><div style="margin-top:9px">${media(m)}</div></div>`).join(''):'<div class="card empty">Защищённых медиа пока нет</div>'}async function checkSystem(){try{const r=await fetch('/health/ready');$('#apiState').textContent=r.ok?'Готов':'Ошибка';$('#apiState').style.color=r.ok?'var(--green)':'var(--red)'}catch{$('#apiState').textContent='Недоступен'}}async function boot(){if(!state.token)return logout();$('#login').classList.add('hidden');$('#app').classList.remove('hidden');try{await loadDashboard()}catch(e){logout();$('#loginError').textContent=e.message}}if(state.token)boot();
</script></body></html>
