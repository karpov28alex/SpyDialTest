<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Диалоги · Phantom</title>
<style>
:root{--bg:#08060d;--panel:#12101a;--panel2:#0c0a11;--line:#342641;--text:#fbf9ff;--muted:#a99db6;--accent:#a84cff;--green:#42d392;--red:#ff7087;--amber:#ffc45d}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif;overflow:hidden}button,input,select{font:inherit}.app{display:grid;grid-template-columns:380px minmax(0,1fr);height:100dvh}.sidebar{border-right:1px solid var(--line);background:linear-gradient(180deg,#110d18,#0a080e);display:flex;flex-direction:column;min-width:0}.side-head{padding:15px;border-bottom:1px solid var(--line)}.title{display:flex;align-items:center;justify-content:space-between;gap:10px}.title h1{font-size:20px;margin:0}.ey{color:#c793ff;font-size:9px;font-weight:900;letter-spacing:.15em;text-transform:uppercase}.toolbar{display:grid;grid-template-columns:1fr auto;gap:7px;margin-top:12px}.input,.select,.btn{border:1px solid var(--line);border-radius:11px;background:#0c0911;color:white;padding:10px 11px;min-width:0}.select{grid-column:1/-1}.btn{cursor:pointer}.btn.primary{border:0;background:linear-gradient(135deg,#7924d0,#b850ff)}.btn:disabled{opacity:.5;cursor:wait}.stats{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.pill{border:1px solid var(--line);border-radius:999px;padding:4px 8px;color:var(--muted);font-size:10px}.pill.good{color:var(--green)}.pill.bad{color:var(--red)}.pill.warn{color:var(--amber)}.list{overflow:auto;flex:1;padding:7px}.dialog{width:100%;display:flex;gap:11px;text-align:left;border:1px solid transparent;border-radius:14px;background:transparent;color:white;padding:10px;cursor:pointer}.dialog:hover,.dialog.active{background:rgba(168,76,255,.12);border-color:rgba(168,76,255,.28)}.avatar{width:46px;height:46px;border-radius:50%;object-fit:cover;background:#2b1d3c;display:grid;place-items:center;flex:0 0 auto;font-weight:800}.dialog-content{min-width:0;flex:1}.dialog-top{display:flex;justify-content:space-between;gap:8px}.dialog-name{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.time{color:var(--muted);font-size:10px;white-space:nowrap}.preview,.owner{display:block;color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.preview.deleted{color:var(--red)}.empty{padding:30px;text-align:center;color:var(--muted)}.chat{display:flex;flex-direction:column;min-width:0;background:radial-gradient(circle at 90% 0,rgba(168,76,255,.1),transparent 30%),var(--bg)}.chat-head{height:72px;padding:12px 17px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;background:rgba(10,8,14,.88);backdrop-filter:blur(12px)}.chat-person{display:flex;align-items:center;gap:11px;min-width:0}.chat-person b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chat-sub{color:var(--muted);font-size:11px}.mobile-back{display:none}.messages{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:9px;scroll-behavior:smooth}.load-more{display:flex;justify-content:center;position:sticky;top:0;z-index:5}.message{max-width:min(76%,760px);align-self:flex-start;border:1px solid var(--line);border-radius:17px 17px 17px 5px;background:#171120;padding:9px 10px;box-shadow:0 8px 25px rgba(0,0,0,.16)}.message.outgoing{align-self:flex-end;border-radius:17px 17px 5px 17px;background:linear-gradient(145deg,#482371,#31174f)}.message.deleted{opacity:.65;border-style:dashed}.message-text{white-space:pre-wrap;word-break:break-word;margin-top:7px}.meta{display:flex;justify-content:flex-end;gap:7px;color:var(--muted);font-size:10px;margin-top:6px}.media-list{display:grid;gap:7px}.media{border:1px solid rgba(255,255,255,.08);border-radius:13px;background:#08060b;overflow:hidden}.media img,.media video:not(.round-video){display:block;max-width:100%;max-height:520px;object-fit:contain;background:#040305}.media-photo{cursor:zoom-in}.round-wrap{display:grid;place-items:center;padding:7px}.round-video{width:250px;height:250px;border-radius:50%;object-fit:cover;background:#040305;box-shadow:0 0 0 4px rgba(255,255,255,.06)}.voice{display:flex;align-items:center;gap:9px;padding:10px;min-width:280px}.voice-icon{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(168,76,255,.18);font-size:18px}audio{width:min(100%,450px);height:42px}.file{display:flex;align-items:center;gap:10px;padding:12px;color:white;text-decoration:none}.file-icon{font-size:25px}.media-info{padding:6px 9px;color:var(--muted);font-size:10px}.unavailable{padding:12px;color:#ffb6c1;background:rgba(255,112,135,.08)}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:80;border:1px solid var(--line);border-radius:13px;padding:12px 16px;background:#17121f;box-shadow:0 15px 45px rgba(0,0,0,.45);display:none;max-width:min(90vw,520px)}.toast.show{display:block}.lightbox{position:fixed;inset:0;display:none;place-items:center;background:rgba(2,1,5,.94);z-index:90;padding:20px}.lightbox.open{display:grid}.lightbox img{max-width:95vw;max-height:92vh;object-fit:contain}.lightbox .btn{position:absolute;right:18px;top:18px}@media(max-width:820px){.app{display:block}.sidebar,.chat{height:100dvh}.chat{display:none}.app.chat-open .sidebar{display:none}.app.chat-open .chat{display:flex}.mobile-back{display:inline-flex}.side-head{padding-top:max(13px,env(safe-area-inset-top))}.messages{padding:10px}.message{max-width:94%}.round-video{width:200px;height:200px}.chat-head{padding-top:max(12px,env(safe-area-inset-top));height:auto;min-height:72px}}
</style>
</head>
<body>
<div class="app" id="app">
<aside class="sidebar">
  <header class="side-head">
    <div class="title"><div><div class="ey">Phantom Telegram Viewer</div><h1>Диалоги</h1></div><button class="btn" id="refreshBtn">↻</button></div>
    <div class="toolbar"><input class="input" id="search" placeholder="Имя, username, Telegram ID, текст"><button class="btn primary" id="searchBtn">Найти</button><select class="select" id="mediaFilter"><option value="all">Все сообщения</option><option value="voice">С голосовыми</option><option value="video_note">С видеокружками</option><option value="video">С видео</option><option value="photo">С фото</option><option value="document">С документами</option><option value="audio">С аудио</option><option value="sticker">Со стикерами</option><option value="animation">С GIF</option></select></div>
    <div class="stats" id="stats"></div>
  </header>
  <div class="list" id="dialogs"><div class="empty">Загрузка всех диалогов…</div></div>
</aside>
<main class="chat">
  <header class="chat-head"><div class="chat-person"><button class="btn mobile-back" id="backBtn">←</button><div class="avatar" id="chatAvatar">💬</div><div style="min-width:0"><b id="chatTitle">Выберите диалог</b><div class="chat-sub" id="chatSub">Вся сохранённая история появится здесь</div></div></div><button class="btn" id="restoreBtn">Восстановить медиа</button></header>
  <section class="messages" id="messages"><div class="empty">Выберите переписку слева</div></section>
</main>
</div>
<div class="toast" id="toast"></div>
<div class="lightbox" id="lightbox"><button class="btn" id="closeLightbox">Закрыть</button><img id="lightboxImage" alt="Фото"></div>
<script>
const $=id=>document.getElementById(id);const E={app:$('app'),dialogs:$('dialogs'),messages:$('messages'),search:$('search'),filter:$('mediaFilter'),stats:$('stats'),title:$('chatTitle'),sub:$('chatSub'),avatar:$('chatAvatar'),toast:$('toast')};const token=()=>sessionStorage.getItem('adminToken')||localStorage.getItem('adminToken');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const dt=v=>v?new Date(v).toLocaleString('ru-RU'):'—';const shortTime=v=>v?new Date(v).toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'}):'';const bytes=n=>{if(!n)return'';const u=['Б','КБ','МБ','ГБ'];let i=0,x=Number(n);while(x>=1024&&i<u.length-1){x/=1024;i++}return `${x.toFixed(i?1:0)} ${u[i]}`};const duration=n=>{if(!n)return'';const s=Number(n);return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`};async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{Authorization:'Bearer '+token(),...(opt.headers||{})},cache:'no-store'});const d=await r.json().catch(()=>({}));if(r.status===401){location.href='/admin';throw Error('Требуется повторный вход')}if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:'Ошибка API');return d}function notify(text){E.toast.textContent=text;E.toast.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>E.toast.classList.remove('show'),5000)}function initials(v){const s=String(v||'?').replace('@','').trim();return esc((s[0]||'?').toUpperCase())}function avatar(src,name){return src?`<img class="avatar" src="${esc(src)}" alt="">`:`<span class="avatar">${initials(name)}</span>`}
let selectedDialog=null,nextBeforeId=null,loadingOlder=false;
async function loadStats(){try{const s=await api('/api/admin/media/archive-stats');E.stats.innerHTML=`<span class="pill">Медиа: ${s.total}</span><span class="pill good">Готово: ${s.downloaded}</span><span class="pill warn">Ожидает: ${s.pending}</span><span class="pill bad">Недоступно: ${s.missing+s.failed}</span>`}catch(e){E.stats.innerHTML=`<span class="pill bad">${esc(e.message)}</span>`}}
async function loadDialogs(){E.dialogs.innerHTML='<div class="empty">Загрузка диалогов…</div>';const q=new URLSearchParams({limit:'1000',search:E.search.value.trim(),media_type:E.filter.value});try{const d=await api('/api/admin/dialog-viewer/dialogs?'+q);E.dialogs.innerHTML=d.items.length?d.items.map(x=>`<button class="dialog" data-dialog="${x.id}">${avatar(x.avatar,x.display_name)}<span class="dialog-content"><span class="dialog-top"><span class="dialog-name">${esc(x.display_name||'Диалог')}</span><span class="time">${shortTime(x.last_message_at)}</span></span><span class="preview ${x.preview_deleted?'deleted':''}">${esc((x.preview_direction==='outgoing'?'Вы: ':'')+(x.preview||'Нет текста'))}</span><span class="owner">Владелец: ${esc(x.owner_username?'@'+x.owner_username:(x.owner_name||x.owner_telegram_id||'—'))} · ${x.messages_count} сообщ.</span></span></button>`).join(''):'<div class="empty">Сохранённых диалогов не найдено</div>';E.dialogs.querySelectorAll('[data-dialog]').forEach(b=>b.onclick=()=>openDialog(+b.dataset.dialog,b));if(selectedDialog){const active=E.dialogs.querySelector(`[data-dialog="${selectedDialog}"]`);active?.classList.add('active')}}catch(e){E.dialogs.innerHTML=`<div class="unavailable"><b>Не удалось загрузить диалоги</b><br>${esc(e.message)}</div>`}}
function mediaMeta(m){return [m.mime_type,bytes(m.size),duration(m.duration),m.width&&m.height?`${m.width}×${m.height}`:''].filter(Boolean).map(esc).join(' · ')}function unavailable(m){return `<div class="media unavailable"><b>${esc(m.filename||m.type||'Медиа')}</b><div>${m.status==='downloaded'?'Файл отсутствует на сервере':'Файл не был загружен'}${m.protected?' · защищённое':''}</div></div>`}function renderMedia(m){if(!m.url)return unavailable(m);const kind=(m.kind||m.type||'document').toLowerCase(),url=esc(m.url),name=esc(m.filename||`media-${m.id}`),mime=esc(m.mime_type||''),info=mediaMeta(m);let body;if(kind==='photo')body=`<img class="media-photo" src="${url}" loading="lazy" alt="${name}" data-lightbox="${url}">`;else if(kind==='video_note')body=`<div class="round-wrap"><video class="round-video" controls playsinline preload="metadata" src="${url}"></video></div>`;else if(kind==='video')body=`<video controls playsinline preload="metadata" src="${url}"></video>`;else if(kind==='animation')body=`<video controls loop muted playsinline preload="metadata" src="${url}"></video>`;else if(kind==='voice')body=`<div class="voice"><span class="voice-icon">🎙</span><audio controls preload="metadata" src="${url}"></audio></div>`;else if(kind==='audio')body=`<div class="voice"><span class="voice-icon">🎵</span><audio controls preload="metadata" src="${url}"></audio></div>`;else if(kind==='sticker'&&mime.startsWith('video/'))body=`<video autoplay loop muted playsinline preload="metadata" src="${url}"></video>`;else if(kind==='sticker'||mime.startsWith('image/'))body=`<img src="${url}" loading="lazy" alt="${name}">`;else body=`<a class="file" href="${url}" target="_blank" rel="noopener"><span class="file-icon">📎</span><span><b>${name}</b><br><small>Открыть файл</small></span></a>`;return `<div class="media">${body}${info?`<div class="media-info">${info}</div>`:''}</div>`}function renderMessage(m){const media=(m.media||[]).map(renderMedia).join(''),text=m.text||m.caption||'';return `<article class="message ${m.direction==='outgoing'?'outgoing':''} ${m.is_deleted?'deleted':''}" data-message-id="${m.id}">${media?`<div class="media-list">${media}</div>`:''}${text?`<div class="message-text">${esc(text)}</div>`:''}<div class="meta">${m.edited_at?'<span>изменено</span>':''}${m.is_deleted?'<span>удалено</span>':''}<span>${dt(m.sent_at)}</span></div></article>`}
async function openDialog(id,button){selectedDialog=id;nextBeforeId=null;document.querySelectorAll('[data-dialog]').forEach(x=>x.classList.remove('active'));button?.classList.add('active');E.app.classList.add('chat-open');E.messages.innerHTML='<div class="empty">Загрузка переписки…</div>';try{const d=await api(`/api/admin/dialogs/${id}/messages?limit=100`);E.title.textContent=d.dialog.display_name||d.dialog.name||'Диалог';E.sub.textContent=[d.dialog.username?'@'+d.dialog.username:'',`${d.total} сообщений`].filter(Boolean).join(' · ');E.avatar.innerHTML=d.dialog.avatar?`<img class="avatar" src="${esc(d.dialog.avatar)}" alt="">`:'💬';nextBeforeId=d.next_before_id;E.messages.innerHTML=(d.has_more?'<div class="load-more"><button class="btn" id="loadMore">Загрузить предыдущие сообщения</button></div>':'')+(d.items.length?d.items.map(renderMessage).join(''):'<div class="empty">Сообщений нет</div>');E.messages.scrollTop=E.messages.scrollHeight;bindMedia();$('loadMore')?.addEventListener('click',loadOlder)}catch(e){E.messages.innerHTML=`<div class="unavailable">${esc(e.message)}</div>`}}
async function loadOlder(){if(!selectedDialog||!nextBeforeId||loadingOlder)return;loadingOlder=true;const button=$('loadMore');if(button){button.disabled=true;button.textContent='Загрузка…'}const oldHeight=E.messages.scrollHeight;try{const d=await api(`/api/admin/dialogs/${selectedDialog}/messages?limit=100&before_id=${nextBeforeId}`);nextBeforeId=d.next_before_id;button?.parentElement?.remove();const fragment=document.createDocumentFragment();if(d.has_more){const wrap=document.createElement('div');wrap.className='load-more';wrap.innerHTML='<button class="btn" id="loadMore">Загрузить предыдущие сообщения</button>';fragment.appendChild(wrap)}const holder=document.createElement('div');holder.innerHTML=d.items.map(renderMessage).join('');while(holder.firstChild)fragment.appendChild(holder.firstChild);E.messages.insertBefore(fragment,E.messages.firstChild);E.messages.scrollTop=E.messages.scrollHeight-oldHeight;bindMedia();$('loadMore')?.addEventListener('click',loadOlder)}catch(e){notify(e.message)}finally{loadingOlder=false}}
function bindMedia(){document.querySelectorAll('[data-lightbox]').forEach(x=>x.onclick=()=>{$('lightboxImage').src=x.dataset.lightbox;$('lightbox').classList.add('open')})}$('closeLightbox').onclick=()=>$('lightbox').classList.remove('open');$('lightbox').onclick=e=>{if(e.target.id==='lightbox')$('lightbox').classList.remove('open')};$('backBtn').onclick=()=>E.app.classList.remove('chat-open');$('searchBtn').onclick=loadDialogs;E.search.addEventListener('keydown',e=>{if(e.key==='Enter')loadDialogs()});E.filter.onchange=loadDialogs;$('refreshBtn').onclick=()=>Promise.all([loadDialogs(),loadStats()]);$('restoreBtn').onclick=async()=>{const b=$('restoreBtn');b.disabled=true;b.textContent='Восстановление…';try{const r=await api('/api/admin/media/backfill?limit=200',{method:'POST'});notify(`Обработано: ${r.selected}. Восстановлено: ${r.restored}. Ошибок: ${r.failed}.`);await loadStats();if(selectedDialog)await openDialog(selectedDialog)}catch(e){notify(e.message)}finally{b.disabled=false;b.textContent='Восстановить медиа'}};Promise.all([loadDialogs(),loadStats()]);
</script>
</body>
</html>
