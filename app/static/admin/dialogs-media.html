<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Диалоги и медиа · Phantom</title><style>
:root{--bg:#08060d;--panel:#14101d;--panel2:#0d0a13;--line:#342641;--text:#faf8ff;--muted:#a99db6;--accent:#a84cff;--green:#42d392;--red:#ff7087}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,rgba(168,76,255,.14),transparent 32%),var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif}button,input{font:inherit}.wrap{max-width:1600px;margin:auto;padding:20px}.head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:16px}.head h1{margin:3px 0;font-size:30px}.ey{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:#ca91ff;font-weight:900}.muted{color:var(--muted)}.btn,.input{border:1px solid var(--line);border-radius:11px;background:#0d0a13;color:white;padding:10px 12px}.btn{cursor:pointer}.btn.primary{border:0;background:linear-gradient(135deg,#7924d0,#b850ff)}.layout{display:grid;grid-template-columns:300px 340px minmax(0,1fr);gap:12px;min-height:calc(100vh - 105px)}.card{border:1px solid var(--line);border-radius:17px;background:linear-gradient(145deg,#15101f,#0e0b15);overflow:hidden}.pane-head{padding:14px;border-bottom:1px solid var(--line)}.pane-body{padding:10px;overflow:auto;height:calc(100vh - 185px)}.search{display:flex;gap:7px}.search .input{width:100%;min-width:0}.list{display:grid;gap:7px}.item{width:100%;text-align:left;border:1px solid transparent;border-radius:12px;background:transparent;color:white;padding:11px;cursor:pointer}.item:hover,.item.active{background:rgba(168,76,255,.11);border-color:rgba(168,76,255,.28)}.item b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;background:#261b33;display:grid;place-items:center;flex:0 0 auto}.row{display:flex;gap:10px;align-items:center}.messages{display:grid;gap:10px;padding:15px;overflow:auto;height:calc(100vh - 185px);scroll-behavior:smooth}.message{max-width:min(76%,720px);border:1px solid var(--line);border-radius:17px 17px 17px 5px;background:#171120;padding:10px 11px;box-shadow:0 10px 28px rgba(0,0,0,.15)}.message.outgoing{margin-left:auto;border-radius:17px 17px 5px 17px;background:linear-gradient(145deg,#45216f,#321852)}.message.deleted{opacity:.65;border-style:dashed}.message-text{white-space:pre-wrap;word-break:break-word;margin-top:7px}.meta{display:flex;gap:7px;justify-content:flex-end;color:var(--muted);font-size:10px;margin-top:7px}.media-list{display:grid;gap:8px}.media{border-radius:13px;overflow:hidden;background:#09070d;border:1px solid rgba(255,255,255,.07)}.media img,.media video:not(.round-video){display:block;max-width:100%;width:auto;max-height:460px;object-fit:contain;background:#050407}.media-photo{cursor:zoom-in}.round-wrap{display:grid;place-items:center;padding:6px}.round-video{width:240px;height:240px;border-radius:50%;object-fit:cover;background:#050407;box-shadow:0 0 0 4px rgba(255,255,255,.06)}audio{display:block;width:min(100%,420px);height:42px}.voice{padding:10px;display:flex;gap:9px;align-items:center;min-width:280px}.voice-icon{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(168,76,255,.18);font-size:18px}.file{display:flex;gap:10px;align-items:center;padding:11px;color:white;text-decoration:none}.file-icon{font-size:24px}.media-info{padding:6px 10px;color:var(--muted);font-size:10px;display:flex;gap:8px;flex-wrap:wrap}.unavailable{padding:12px;color:#ffb2bf;background:rgba(255,112,135,.08)}.empty{padding:30px;text-align:center;color:var(--muted)}.badge{display:inline-flex;padding:3px 7px;border-radius:999px;background:rgba(168,76,255,.16);color:#e4c7ff;font-size:10px}.lightbox{position:fixed;inset:0;background:rgba(3,2,6,.92);display:none;place-items:center;padding:20px;z-index:50}.lightbox.open{display:grid}.lightbox img{max-width:95vw;max-height:92vh;object-fit:contain}.lightbox button{position:absolute;right:18px;top:18px}@media(max-width:1100px){.layout{grid-template-columns:260px minmax(0,1fr)}.dialogs-card{display:none}.dialogs-card.mobile-open{display:block;position:fixed;inset:12px;z-index:20}.users-card.hidden-mobile{display:none}}@media(max-width:700px){.wrap{padding:11px}.head{display:block}.layout{grid-template-columns:1fr}.users-card{display:none}.dialogs-card{display:none}.chat-card{min-height:calc(100vh - 100px)}.messages{height:calc(100vh - 175px);padding:9px}.message{max-width:92%}.round-video{width:190px;height:190px}.pane-body{height:calc(100vh - 180px)}}
</style></head><body><main class="wrap"><header class="head"><div><div class="ey">Phantom Platform 2.3</div><h1>Диалоги и медиа</h1><div class="muted">Голосовые, видеокружки, видео, фото, документы, стикеры и анимации.</div></div><button class="btn" id="refreshBtn">↻ Обновить</button></header><section class="layout"><aside class="card users-card"><div class="pane-head"><div class="search"><input class="input" id="userSearch" placeholder="Telegram ID или username"><button class="btn primary" id="searchBtn">Найти</button></div></div><div class="pane-body"><div class="list" id="users"><div class="empty">Введите пользователя</div></div></div></aside><aside class="card dialogs-card" id="dialogsCard"><div class="pane-head"><b id="dialogsTitle">Диалоги</b><div class="muted" id="dialogsHint">Сначала выберите пользователя</div></div><div class="pane-body"><div class="list" id="dialogs"><div class="empty">Нет данных</div></div></div></aside><section class="card chat-card"><div class="pane-head"><div class="row"><div class="avatar" id="chatAvatar">💬</div><div><b id="chatTitle">Переписка</b><div class="muted" id="chatHint">Выберите диалог</div></div></div></div><div class="messages" id="messages"><div class="empty">Сообщения появятся здесь</div></div></section></section></main><div class="lightbox" id="lightbox"><button class="btn" id="closeLightbox">Закрыть</button><img id="lightboxImage" alt="Медиа"></div><script>
const $=id=>document.getElementById(id);const E={users:$('users'),dialogs:$('dialogs'),messages:$('messages'),search:$('userSearch'),chatTitle:$('chatTitle'),chatHint:$('chatHint'),chatAvatar:$('chatAvatar'),dialogsTitle:$('dialogsTitle'),dialogsHint:$('dialogsHint'),dialogsCard:$('dialogsCard')};const token=()=>sessionStorage.getItem('adminToken')||localStorage.getItem('adminToken');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const dt=v=>v?new Date(v).toLocaleString('ru-RU'):'—';const size=n=>{if(!n)return'';const u=['Б','КБ','МБ','ГБ'];let i=0,x=Number(n);while(x>=1024&&i<u.length-1){x/=1024;i++}return `${x.toFixed(i?1:0)} ${u[i]}`};const dur=n=>{if(!n)return'';const s=Number(n),m=Math.floor(s/60);return `${m}:${String(s%60).padStart(2,'0')}`};async function api(url){const r=await fetch(url,{headers:{Authorization:'Bearer '+token()},cache:'no-store'});const d=await r.json().catch(()=>({}));if(r.status===401){location.href='/admin';throw Error('Требуется вход')}if(!r.ok)throw Error(d.detail||'Ошибка API');return d}function initials(x){const s=(x||'?').replace('@','').trim();return esc((s[0]||'?').toUpperCase())}function avatar(src,name){return src?`<img class="avatar" src="${esc(src)}" alt="">`:`<span class="avatar">${initials(name)}</span>`}
let selectedUser=null,selectedDialog=null;async function searchUsers(){const q=E.search.value.trim();if(!q){E.users.innerHTML='<div class="empty">Введите Telegram ID, username или имя</div>';return}E.users.innerHTML='<div class="empty">Загрузка…</div>';try{const d=await api('/api/admin/user360/search?q='+encodeURIComponent(q)+'&limit=50');E.users.innerHTML=d.items.length?d.items.map(u=>`<button class="item" data-user="${u.id}"><div class="row">${avatar('',u.name||u.username)}<div><b>${esc(u.name||u.username||u.telegram_id)}</b><span class="muted">${esc(u.username?'@'+u.username:u.telegram_id)} · ${esc(u.subscription_status||'')}</span></div></div></button>`).join(''):'<div class="empty">Пользователи не найдены</div>';E.users.querySelectorAll('[data-user]').forEach(b=>b.onclick=()=>loadDialogs(+b.dataset.user,b))}catch(e){E.users.innerHTML='<div class="unavailable">'+esc(e.message)+'</div>'}}
async function loadDialogs(userId,button){selectedUser=userId;document.querySelectorAll('[data-user]').forEach(x=>x.classList.remove('active'));button?.classList.add('active');E.dialogs.innerHTML='<div class="empty">Загрузка…</div>';try{const d=await api(`/api/admin/users/${userId}/dialogs`);E.dialogsTitle.textContent='Диалоги пользователя';E.dialogsHint.textContent=`Найдено: ${d.items.length}`;E.dialogs.innerHTML=d.items.length?d.items.map(x=>`<button class="item" data-dialog="${x.id}"><div class="row">${avatar(x.avatar,x.name)}<div style="min-width:0"><b>${esc(x.display_name||x.name||x.username||'Диалог')}</b><span class="muted">${x.messages_count} сообщений · ${dt(x.last_message_at)}</span></div></div></button>`).join(''):'<div class="empty">Диалогов нет</div>';E.dialogs.querySelectorAll('[data-dialog]').forEach(b=>b.onclick=()=>loadMessages(+b.dataset.dialog,b));if(innerWidth<=1100)E.dialogsCard.classList.add('mobile-open')}catch(e){E.dialogs.innerHTML='<div class="unavailable">'+esc(e.message)+'</div>'}}
function mediaMeta(m){return [m.mime_type,size(m.size),dur(m.duration),m.width&&m.height?`${m.width}×${m.height}`:''].filter(Boolean).map(esc).join(' · ')}function mediaUnavailable(m){return `<div class="media unavailable"><b>${esc(m.filename||m.type||'Медиа')}</b><div>${m.status==='downloaded'?'Файл недоступен':'Файл ещё не загружен'}${m.protected?' · защищённое медиа':''}</div></div>`}function renderMedia(m){if(!m.url)return mediaUnavailable(m);const kind=(m.kind||m.type||'document').toLowerCase(),info=mediaMeta(m),name=esc(m.filename||`media-${m.id}`),url=esc(m.url),mime=esc(m.mime_type||'');let body='';if(kind==='photo'){body=`<img class="media-photo" src="${url}" loading="lazy" alt="${name}" data-lightbox="${url}">`}else if(kind==='video_note'){body=`<div class="round-wrap"><video class="round-video" controls playsinline preload="metadata" src="${url}"${mime?` type="${mime}"`:''}></video></div>`}else if(kind==='video'){body=`<video controls playsinline preload="metadata" src="${url}"${mime?` type="${mime}"`:''}></video>`}else if(kind==='animation'){body=`<video controls loop muted playsinline preload="metadata" src="${url}"${mime?` type="${mime}"`:''}></video>`}else if(kind==='voice'){body=`<div class="voice"><span class="voice-icon">🎙</span><audio controls preload="metadata" src="${url}"></audio></div>`}else if(kind==='audio'){body=`<div class="voice"><span class="voice-icon">🎵</span><audio controls preload="metadata" src="${url}"></audio></div>`}else if(kind==='sticker'&&m.mime_type?.startsWith('video/')){body=`<video autoplay loop muted playsinline preload="metadata" src="${url}"></video>`}else if(kind==='sticker'||m.mime_type?.startsWith('image/')){body=`<img src="${url}" loading="lazy" alt="${name}">`}else{body=`<a class="file" href="${url}" target="_blank" rel="noopener"><span class="file-icon">📎</span><span><b>${name}</b><br><small class="muted">Открыть или скачать</small></span></a>`}return `<div class="media">${body}${info?`<div class="media-info">${info}</div>`:''}</div>`}
function renderMessage(m){const media=(m.media||[]).map(renderMedia).join(''),text=m.text||m.caption||'';return `<article class="message ${m.direction==='outgoing'?'outgoing':''} ${m.is_deleted?'deleted':''}">${media?`<div class="media-list">${media}</div>`:''}${text?`<div class="message-text">${esc(text)}</div>`:''}<div class="meta">${m.edited_at?'<span>изменено</span>':''}${m.is_deleted?'<span>удалено</span>':''}<span>${dt(m.sent_at)}</span></div></article>`}
async function loadMessages(dialogId,button){selectedDialog=dialogId;document.querySelectorAll('[data-dialog]').forEach(x=>x.classList.remove('active'));button?.classList.add('active');E.messages.innerHTML='<div class="empty">Загрузка переписки…</div>';if(innerWidth<=1100)E.dialogsCard.classList.remove('mobile-open');try{const d=await api(`/api/admin/dialogs/${dialogId}/messages?limit=1000`);E.chatTitle.textContent=d.dialog.display_name||d.dialog.name||'Диалог';E.chatHint.textContent=[d.dialog.username?'@'+d.dialog.username:'',`${d.items.length} сообщений`].filter(Boolean).join(' · ');E.chatAvatar.innerHTML=d.dialog.avatar?`<img class="avatar" src="${esc(d.dialog.avatar)}" alt="">`:'💬';E.messages.innerHTML=d.items.length?d.items.map(renderMessage).join(''):'<div class="empty">Сообщений нет</div>';E.messages.scrollTop=E.messages.scrollHeight;bindLightbox()}catch(e){E.messages.innerHTML='<div class="unavailable">'+esc(e.message)+'</div>'}}
function bindLightbox(){document.querySelectorAll('[data-lightbox]').forEach(x=>x.onclick=()=>{$('lightboxImage').src=x.dataset.lightbox;$('lightbox').classList.add('open')})}$('closeLightbox').onclick=()=>$('lightbox').classList.remove('open');$('lightbox').onclick=e=>{if(e.target.id==='lightbox')$('lightbox').classList.remove('open')};$('searchBtn').onclick=searchUsers;E.search.onkeydown=e=>{if(e.key==='Enter')searchUsers()};$('refreshBtn').onclick=()=>selectedDialog?loadMessages(selectedDialog):selectedUser?loadDialogs(selectedUser):searchUsers();
</script></body></html>
