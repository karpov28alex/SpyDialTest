<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Phantom · Центр поддержки</title>
<style>
:root{--bg:#07050c;--panel:#151020;--line:#3b2851;--text:#fff;--muted:#aa9fba;--accent:#a43cff;--green:#48d99b;--red:#ff668d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#2b1048 0,transparent 32%),var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif}.wrap{max-width:1400px;margin:auto;padding:18px}.top,.toolbar,.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.top{justify-content:space-between;margin-bottom:16px}.card{background:linear-gradient(145deg,rgba(27,18,42,.97),rgba(11,8,17,.97));border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.split{display:grid;grid-template-columns:1.25fr 1fr;gap:14px}input,textarea,select{width:100%;border:1px solid var(--line);background:#09070f;color:#fff;border-radius:13px;padding:12px;font:inherit}textarea{min-height:150px;resize:vertical}.toolbar input{flex:1;min-width:240px}.btn{border:0;border-radius:13px;padding:12px 15px;color:#fff;cursor:pointer;background:#1b1325}.primary{background:linear-gradient(135deg,var(--accent),#6929db);font-weight:800}.danger{background:#481326}.good{color:var(--green)}.bad{color:var(--red)}.muted{color:var(--muted)}table{width:100%;border-collapse:collapse}td,th{padding:11px;border-bottom:1px solid var(--line);text-align:left}.click{cursor:pointer}.click:hover{background:rgba(164,60,255,.08)}.metric span{color:var(--muted)}.metric strong{display:block;font-size:26px;margin-top:7px}.tags{display:flex;gap:7px;flex-wrap:wrap}.tag{padding:5px 9px;border-radius:999px;background:rgba(164,60,255,.18);color:#e5c9ff}.notice{padding:11px;border-radius:12px;margin-top:10px;background:rgba(72,217,155,.1);color:var(--green)}.error{color:var(--red);margin-top:10px}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}.split{grid-template-columns:1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.wrap{padding:10px}.top h1{font-size:24px}}
</style>
</head>
<body><div class="wrap">
<div class="top"><div><h1>Центр поддержки</h1><div class="muted">Пользователи, заметки, теги и управление доступом</div></div><a class="btn" href="/admin">← Основная админка</a></div>
<div class="card"><div class="toolbar"><input id="query" placeholder="Telegram ID, username или имя"><button id="search" class="btn primary">Найти</button></div><div id="searchError" class="error"></div><div id="results"></div></div>
<div id="workspace" style="display:none"><div id="summary" class="grid"></div><div class="split"><div class="card"><h2 id="userTitle">Пользователь</h2><div id="userMeta" class="muted"></div><h3>Теги</h3><input id="tags" placeholder="VIP, поддержка, блогер — через запятую"><h3>Внутренняя заметка</h3><textarea id="note" placeholder="Видна только администраторам"></textarea><button id="save" class="btn primary">Сохранить заметку</button><div id="saveMsg"></div></div><div class="card"><h2>Доступ</h2><div id="accessState"></div><label>Причина изменения<textarea id="reason" style="min-height:90px"></textarea></label><div class="actions"><button id="disable" class="btn danger">Отключить доступ</button><button id="enable" class="btn primary">Вернуть доступ</button></div><h2 style="margin-top:24px">Быстрые переходы</h2><div class="actions"><button id="openUser" class="btn">Карточка в основной админке</button><a id="telegramLink" class="btn" target="_blank">Открыть Telegram</a></div></div></div></div>
<div class="card"><h2>Последние действия администраторов</h2><div id="audit"></div></div>
</div>
<script>
const token=sessionStorage.getItem('adminToken');if(!token)location.href='/admin';const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=v=>v?new Date(v).toLocaleString('ru-RU'):'—';let current=null;
async function api(path,opt={}){const r=await fetch(path,{...opt,headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`,...(opt.headers||{})},cache:'no-store'});const d=await r.json().catch(()=>({}));if(r.status===401){location.href='/admin';throw Error('Сессия завершена')}if(!r.ok)throw Error(d.detail||'Ошибка API');return d}
function metric(label,value,cls=''){return `<div class="card metric"><span>${esc(label)}</span><strong class="${cls}">${esc(value)}</strong></div>`}
async function search(){try{$('#searchError').textContent='';const q=$('#query').value.trim();const d=await api('/api/admin/growth/users?search='+encodeURIComponent(q)+'&limit=50');$('#results').innerHTML=d.items.length?`<table><tr><th>Пользователь</th><th>ID</th><th>Статус</th><th>Активность</th></tr>${d.items.map(u=>`<tr class="click" onclick="openSupport(${u.id})"><td><b>${esc(u.name||u.username||'Без имени')}</b><div class="muted">@${esc(u.username||'—')}</div></td><td>${u.telegram_id}</td><td>${esc(u.subscription_status)}</td><td>${fmt(u.last_seen_at)}</td></tr>`).join('')}</table>`:'<div class="muted" style="padding-top:15px">Ничего не найдено</div>'}catch(e){$('#searchError').textContent=e.message}}
async function openSupport(id){const d=await api(`/api/admin/growth/users/${id}/support`);current=d;const u=d.user;$('#workspace').style.display='block';$('#userTitle').textContent=u.name||u.username||'Пользователь';$('#userMeta').innerHTML=`@${esc(u.username||'—')} · Telegram ID ${u.telegram_id}<br>Регистрация: ${fmt(u.registered_at)}<br>Последняя активность: ${fmt(u.last_seen_at)}`;$('#summary').innerHTML=[metric('Статус',u.subscription_status),metric('Business',d.business_connected?'Подключён':'Не подключён',d.business_connected?'good':'bad'),metric('Успешных оплат',d.payments_count),metric('Оплачено',`${d.paid_total.toLocaleString('ru-RU')} ₽`)].join('');$('#tags').value=(d.meta.tags||[]).join(', ');$('#note').value=d.meta.note||'';renderAccess();$('#telegramLink').href=u.username?`https://t.me/${u.username}`:`tg://user?id=${u.telegram_id}`;$('#openUser').onclick=()=>location.href='/admin#users';window.scrollTo({top:$('#workspace').offsetTop-12,behavior:'smooth'})}
function renderAccess(){const disabled=current.access_disabled;$('#accessState').innerHTML=`<p>Текущее состояние: <b class="${disabled?'bad':'good'}">${disabled?'Доступ отключён':'Доступ разрешён'}</b></p>`;$('#disable').disabled=disabled;$('#enable').disabled=!disabled}
$('#search').onclick=search;$('#query').addEventListener('keydown',e=>{if(e.key==='Enter')search()});$('#save').onclick=async()=>{if(!current)return;try{const tags=$('#tags').value.split(',').map(x=>x.trim()).filter(Boolean);const d=await api(`/api/admin/growth/users/${current.user.id}/support`,{method:'PATCH',body:JSON.stringify({note:$('#note').value,tags})});current.meta=d.meta;$('#saveMsg').innerHTML='<div class="notice">Заметка и теги сохранены</div>';loadAudit()}catch(e){$('#saveMsg').innerHTML=`<div class="error">${esc(e.message)}</div>`}};
async function setAccess(disabled){if(!current)return;const action=disabled?'отключить':'вернуть';if(!confirm(`Подтвердить: ${action} доступ пользователю?`))return;await api(`/api/admin/growth/users/${current.user.id}/access`,{method:'PATCH',body:JSON.stringify({disabled,reason:$('#reason').value})});current.access_disabled=disabled;renderAccess();loadAudit()}
$('#disable').onclick=()=>setAccess(true);$('#enable').onclick=()=>setAccess(false);
async function loadAudit(){const d=await api('/api/admin/growth/audit?limit=80');$('#audit').innerHTML=d.items.length?`<table><tr><th>Дата</th><th>Администратор</th><th>Действие</th><th>Детали</th></tr>${d.items.map(x=>`<tr><td>${fmt(x.at)}</td><td>${esc(x.admin)}</td><td>${esc(x.action)}</td><td class="muted">${esc(JSON.stringify(x.details||{}))}</td></tr>`).join('')}</table>`:'<div class="muted">Действий пока нет</div>'}loadAudit();
</script></body></html>
